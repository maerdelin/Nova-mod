name: NOVA Tianyi Android 11 installation smoke
on:
  push:
    branches: ['feat/tianyi-cloud-webdav-20261106']
    paths: ['.github/workflows/tianyi-smoke.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Download signed Tianyi APK built from validated MOD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testapk
          gh run download 42176822312 --repo "$GITHUB_REPOSITORY" --name NOVA-Tianyi-Cloud-TEST-SIGNED --dir testapk
          test -s testapk/dist/NOVA_Tianyi_Cloud_TEST_SIGNED.apk
          (cd testapk/dist && sha256sum -c SHA256SUMS.txt)
      - name: Install on clean Android 11 emulator and launch phone plus TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash <<'NOVA_SMOKE_BASH'
            set -euo pipefail
            mkdir -p reports
            adb logcat -c
            trap 'adb logcat -d -v threadtime > reports/logcat.txt 2>/dev/null || true' EXIT
            adb install -r testapk/dist/NOVA_Tianyi_Cloud_TEST_SIGNED.apk | tee reports/install.txt
            adb shell monkey -p org.courville.nova -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof org.courville.nova | tee reports/phone-pid.txt || true
            adb shell am force-stop org.courville.nova
            adb shell monkey -p org.courville.nova -c android.intent.category.LEANBACK_LAUNCHER 1
            sleep 8
            adb shell pidof org.courville.nova | tee reports/tv-pid.txt || true
            adb logcat -d -v threadtime > reports/logcat.txt
            grep -E -A 18 'FATAL EXCEPTION|VerifyError|NoClassDefFoundError|UnsatisfiedLinkError|Unable to create application' reports/logcat.txt | tail -n 120 | tee reports/fatal-summary.txt || true
            if grep -q 'FATAL EXCEPTION' reports/logcat.txt; then
              echo 'ANDROID11_TIANYI_RUNTIME=FAIL' | tee reports/result.txt
              exit 1
            fi
            if ! adb shell pidof org.courville.nova | grep -q '[0-9]'; then
              echo 'ANDROID11_TIANYI_PROCESS_NOT_RUNNING=FAIL' | tee reports/result.txt
              exit 1
            fi
            echo "NOVA_TIANYI_ANDROID11_INSTALL_START=PASS" | tee reports/result.txt
            NOVA_SMOKE_BASH
      - name: Upload Android 11 smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Tianyi-Android11-Smoke
          path: reports/
          retention-days: 7
