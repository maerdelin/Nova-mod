name: Nova V7.14 Network Only Center V3 - Emulator Smoke
on:
  push:
    branches: [feature/v714-network-shortcuts-dynamic-center-20261014]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build exact AutoMode baseline and patch only network UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs dist
          python3 -m py_compile scripts/build_universal.py scripts/restore_auto_mode.py scripts/network_center_v3.py
          python3 -m unittest discover -s tests -v
          curl -fL --retry 4 --retry-delay 3 -o inputs/confirmed-arm32.apk 'https://github.com/maerdelin/Nova-mod/releases/download/v7.14-three-buttons-run-38359455887-attempt-1/NovaTV_V7_14_ThreeButtons_ARM32_Test.apk'
          echo 'b48c77f62c265b9da979010a1e88829773cd82a3b900f479584f0f0aa752786d  inputs/confirmed-arm32.apk' | sha256sum --check
          curl -fL --retry 4 --retry-delay 3 -o inputs/official-universal.apk 'https://github.com/nova-video-player/aos-AVP/releases/download/v6.5.5/org.courville.nova-2672099-6.5.5-20261009.2113-universal-release.apk'
          echo 'f252631680328916ed847c8c0d6711d6a9922373e54f939178c428a9b3c3e1a5  inputs/official-universal.apk' | sha256sum --check
          python3 scripts/build_universal.py merge inputs/confirmed-arm32.apk inputs/official-universal.apk dist/base-unsigned.apk
          python3 scripts/build_universal.py verify inputs/confirmed-arm32.apk inputs/official-universal.apk dist/base-unsigned.apk
          python3 scripts/network_center_v3.py dist/base-unsigned.apk dist/network-unsigned.apk

      - name: Zipalign and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          ALIGN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -n1)"
          KEYSTORE="$RUNNER_TEMP/network-test.jks"
          PASS="$(openssl rand -hex 14)"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -alias network-test -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Nova Network V3 Test' -storepass "$PASS" -keypass "$PASS" >/dev/null
          "$ALIGN" -p -f 4 dist/network-unsigned.apk dist/network-aligned.apk
          "$ALIGN" -c -v 4 dist/network-aligned.apk | tail -n2
          "$SIGNER" sign --min-sdk-version 23 --ks "$KEYSTORE" --ks-key-alias network-test --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk dist/network-aligned.apk
          "$SIGNER" verify --min-sdk-version 23 --verbose --print-certs dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk
          python3 - <<'PY'
          import zipfile,hashlib
          p='dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('classes.dex')).hexdigest()=='f94fa9e541a9b69921e76385fff7c21d2fd7bc5f46980b11ea87af0d2d59d37e'
              assert hashlib.sha256(z.read('res/Am.xml')).hexdigest()=='b246497606d126efa7e56156952bfd059538b9ffb18afb7a1c4cc44380293262'
              assert hashlib.sha256(z.read('res/mC.xml')).hexdigest()=='559a5e7d1b679338e5fb9be9eface0ee1edc7ef4ca454651b851ed9084b6a1bc'
              print('PASS: signed APK network-specific patch; original home and shared Leanback XML unchanged')
          PY
          sha256sum dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk | tee dist/SHA256SUMS.txt
          rm -f "$KEYSTORE"

      - name: Enable accelerated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android TV x86_64 installation launch network page and logcat smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk
            adb logcat -c
            adb shell monkey -p org.courville.nova 1
            sleep 15
            adb shell pidof org.courville.nova
            adb shell input keyevent 23
            sleep 12
            adb shell pidof org.courville.nova
            adb shell screencap -p /sdcard/nova_network_v3.png
            adb pull /sdcard/nova_network_v3.png dist/nova_network_v3.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml dist/network_uiautomator.xml || true
            adb logcat -d -v time > dist/nova_android_logcat.txt
            if grep -Eq 'FATAL EXCEPTION|Failed to verify dex file|VerifyError|AndroidRuntime.*org.courville.nova' dist/nova_android_logcat.txt; then
              echo 'ERROR: Android runtime crashed; inspect dist/nova_android_logcat.txt'
              exit 1
            fi
            echo 'PASS: installed and survived boot/network-open keyevent on Android TV x86_64 emulator'

      - name: Archive signed version and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-V714-Network-Centered-V3-Signed-Emulator-TEST
          path: |
            dist/Nova_V7_14_Network_Only_Centered_v3_CI.apk
            dist/SHA256SUMS.txt
            dist/nova_network_v3.png
            dist/network_uiautomator.xml
            dist/nova_android_logcat.txt
          if-no-files-found: warn
          retention-days: 30
