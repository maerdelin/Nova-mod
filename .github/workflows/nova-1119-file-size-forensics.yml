name: NOVA 1119 file size when resumed forensic proof
on:
  push:
    branches:
      - fix/1119-progress-size-all-three-20261103
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Decode official player and trace real size binder signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools inputs work reports/1119
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          python3 scripts/check_upstream.py download --apk inputs/official.apk --metadata inputs/upstream.json
          java -Xmx4g -jar tools/apktool.jar d --no-debug-info -f inputs/official.apk -o work/decoded > reports/1119/decode.log
          python3 - <<'PY' | tee reports/1119/forensic.txt
          from pathlib import Path
          import re,json
          root=Path('work/decoded')
          targets={
              'VideoCursorMapper.smali':('bind(Landroid/database/Cursor;)Ljava/lang/Object;',),
              'VideoListPresenter.smali':('bindView(Landroid/view/View;Ljava/lang/Object;Lcom/archos/mediacenter/utils/ThumbnailEngine$Result;I)Landroid/view/View;','onBindListViewHolder(Lcom/archos/mediacenter/video/leanback/presenter/ListPresenter$ListViewHolder;Ljava/lang/Object;)V'),
              'PosterImageCardPresenter.smali':('bindVideo(Lcom/archos/mediacenter/video/leanback/presenter/PosterImageCardPresenter$VideoViewHolder;Lcom/archos/mediacenter/video/browser/adapters/object/Video;)V',),
              'Video.smali':('getSize()J',),
              'NonIndexedVideo.smali':('<init>',),
          }
          for name,sigs in targets.items():
              matches=list(root.glob('smali*/**/'+name))
              print('NOVA_SIZE_CLASS',name,len(matches))
              for f in matches:
                  if not any(x in str(f) for x in ['/browser/','/leanback/','/adapters/']):
                      continue
                  src=f.read_text()
                  print('NOVA_SIZE_PATH',f)
                  methods=['.method '+t.split('.end method',1)[0]+'.end method' for t in src.split('.method ')[1:] if '.end method' in t]
                  for m in methods:
                      h=m.splitlines()[0]
                      if any(sig.split('(')[0]+'(' in h for sig in sigs) or (name=='VideoCursorMapper.smali' and 'bind' in h):
                          print('NOVA_SIZE_METHOD_START',h)
                          for i,line in enumerate(m.splitlines()):
                              if name=='VideoCursorMapper.smali':
                                  if any(x in line for x in ['mSizeColumn','Cursor;->getInt(I)I','Cursor;->getLong(I)J','Video;-><init>','Movie;-><init>','Episode;-><init>']):
                                      print('NOVA_SIZE_CODE',i,line)
                              elif name in ('VideoListPresenter.smali','PosterImageCardPresenter.smali'):
                                  print('NOVA_SIZE_CODE',i,line)
                              else:
                                  if any(x in line for x in ['getSize','mSize','return-wide','const-wide','Video;-><init>','invoke-direct']):
                                      print('NOVA_SIZE_CODE',i,line)
                          if name=='VideoCursorMapper.smali' and 'bind(' in h:
                              ml=m.splitlines()
                              for i,line in enumerate(ml):
                                  if 'mSizeColumn' in line:
                                      for j in range(max(0,i-8),min(len(ml),i+20)):
                                          print('NOVA_SIZE_CURSOR_CONTEXT',j,ml[j])
                          print('NOVA_SIZE_METHOD_END',h)
          print('NOVA_SIZE_PATCH_METHODS')
          patch=json.loads(Path('patches/v982-granular.json').read_text())
          for idx in (14,37,38):
              op=patch['methods'][idx]
              print('NOVA_SIZE_PATCH',idx,op['class'],op['method'])
              for h in op['hunks']:
                  for line in h.get('after',[]):
                      if any(x in line for x in ('getSize()J','NonIndexedVideo','formatFileSize','cmp-long','if-lez','setVisibility','setContentText')):
                          print('NOVA_SIZE_PATCH_LINE',line)
          print('NOVA_SIZE_PROOF_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nova-1119-size-forensics
          path: reports/1119/
          retention-days: 7
