name: Nova rebuffer V1 test

on:
  workflow_dispatch:
  push:
    branches: [ci/rebuffer-v1]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build maven build-essential wget curl unzip git pkg-config python3 python3-pip python3-setuptools
          curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync official Nova source
        run: |
          set -euo pipefail
          mkdir source
          cd source
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m default.xml
          repo sync -j4
          repo forall -c 'git checkout -B rebuffer-v1 $REPO_REMOTE/$REPO_RREV'

      - name: Apply native rebuffer patch
        run: |
          set -euo pipefail
          python3 rebuffer/apply_rebuffer_v1.py source
          grep -n "NOVA_REBUFFER_" source/native/avos/Source/stream_audio.c
          grep -n "MEDIA_INFO_BUFFERING_START" source/Video/src/main/java/com/archos/mediacenter/video/player/Player.java

      - name: Build Nova from source
        run: |
          set -euo pipefail
          cd source/Video
          ./gradlew --no-daemon aNR

      - name: Collect universal APK
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find source/Video -type f -name '*.apk' | grep -E 'universal|noamazon' | head -n 1 || true)"
          if [[ -z "$apk" ]]; then apk="$(find source/Video -type f -name '*.apk' | head -n 1)"; fi
          test -n "$apk"
          cp "$apk" out/Nova_Rebuffer_V1_UNSIGNED_INPUT.apk
          unzip -l "$apk" | grep -q 'lib/.*/libavos.so'

      - name: Align sign and verify
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          ALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          STORE="$RUNNER_TEMP/nova-rebuffer.jks"
          trap 'rm -f "$STORE"' EXIT
          if [[ -n "$NOVA_KEYSTORE_BASE64" && -n "$NOVA_STORE_PASSWORD" && -n "$NOVA_KEY_ALIAS" && -n "$NOVA_KEY_PASSWORD" ]]; then
            printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 -d > "$STORE"
          else
            NOVA_STORE_PASSWORD="$(openssl rand -hex 16)"
            NOVA_KEY_PASSWORD="$NOVA_STORE_PASSWORD"
            NOVA_KEY_ALIAS=nova-rebuffer-test
            keytool -genkeypair -noprompt -keystore "$STORE" -alias "$NOVA_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Nova Rebuffer V1 Test' -storepass "$NOVA_STORE_PASSWORD" -keypass "$NOVA_KEY_PASSWORD"
          fi
          "$ALIGN" -f -p 4 out/Nova_Rebuffer_V1_UNSIGNED_INPUT.apk out/Nova_Rebuffer_V1_ALIGNED.apk
          export NOVA_STORE_PASSWORD NOVA_KEY_PASSWORD
          "$SIGNER" sign --min-sdk-version 23 --v4-signing-enabled false --ks "$STORE" --ks-key-alias "$NOVA_KEY_ALIAS" --ks-pass env:NOVA_STORE_PASSWORD --key-pass env:NOVA_KEY_PASSWORD --out out/Nova_Rebuffer_V1_TEST.apk out/Nova_Rebuffer_V1_ALIGNED.apk
          "$SIGNER" verify --min-sdk-version 23 --verbose --print-certs out/Nova_Rebuffer_V1_TEST.apk
          "$ALIGN" -c 4 out/Nova_Rebuffer_V1_TEST.apk
          strings <(unzip -p out/Nova_Rebuffer_V1_TEST.apk lib/arm64-v8a/libavos.so) | grep -q 'NOVA_REBUFFER_START' || true
          sha256sum out/Nova_Rebuffer_V1_TEST.apk > out/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Rebuffer-V1-Test
          path: |
            out/Nova_Rebuffer_V1_TEST.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
