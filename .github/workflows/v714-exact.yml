name: Nova V7.14 Three Buttons - Removable First Verifier Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nova-universal-three-buttons
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout pinned build scripts
        uses: actions/checkout@v4

      - name: Validate scripts and pinned official sources
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_universal.py
          python3 -m unittest discover -s tests -v
          mkdir -p inputs dist
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output inputs/confirmed-arm32.apk \
            'https://github.com/maerdelin/Nova-mod/releases/download/v7.14-three-buttons-run-38359455887-attempt-1/NovaTV_V7_14_ThreeButtons_ARM32_Test.apk'
          echo 'b48c77f62c265b9da979010a1e88829773cd82a3b900f479584f0f0aa752786d  inputs/confirmed-arm32.apk' | sha256sum --check --strict
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output inputs/official-universal.apk \
            'https://github.com/nova-video-player/aos-AVP/releases/download/v6.5.5/org.courville.nova-2672099-6.5.5-20261009.2113-universal-release.apk'
          echo 'f252631680328916ed847c8c0d6711d6a9922373e54f939178c428a9b3c3e1a5  inputs/official-universal.apk' | sha256sum --check --strict

      - name: Merge official ABI libraries with localized root removable-storage directory patch
        run: |
          set -euo pipefail
          python3 scripts/build_universal.py merge inputs/confirmed-arm32.apk inputs/official-universal.apk dist/unsigned-universal.apk
          python3 scripts/build_universal.py verify inputs/confirmed-arm32.apk inputs/official-universal.apk dist/unsigned-universal.apk

      - name: Zipalign, sign, verify Universal APK
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          ALIGN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -n1)"
          KEYSTORE="$RUNNER_TEMP/universal-three-button.jks"
          if [[ -n "$NOVA_KEYSTORE_BASE64" && -n "$NOVA_STORE_PASSWORD" && -n "$NOVA_KEY_ALIAS" && -n "$NOVA_KEY_PASSWORD" ]]; then
            printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo 'Using configured signing certificate'
          elif [[ -n "$NOVA_KEYSTORE_BASE64" || -n "$NOVA_STORE_PASSWORD" || -n "$NOVA_KEY_ALIAS" || -n "$NOVA_KEY_PASSWORD" ]]; then
            echo "::error::Incomplete signing secrets; refusing to sign"
            exit 1
          else
            NOVA_STORE_PASSWORD="$(openssl rand -hex 16)"
            NOVA_KEY_PASSWORD="$NOVA_STORE_PASSWORD"
            NOVA_KEY_ALIAS=nova-v714-universal-test
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -alias "$NOVA_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Nova Universal Test, O=Nova Mod' -storepass "$NOVA_STORE_PASSWORD" -keypass "$NOVA_KEY_PASSWORD" > /dev/null
            echo '::warning::Temporary signing certificate; cannot upgrade a differently signed installed APK'
          fi
          chmod 600 "$KEYSTORE"
          export NOVA_STORE_PASSWORD NOVA_KEY_PASSWORD
          "$ALIGN" -p -f 4 dist/unsigned-universal.apk dist/aligned-universal.apk
          "$ALIGN" -c -v 4 dist/aligned-universal.apk
          "$SIGNER" sign --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --ks "$KEYSTORE" --ks-key-alias "$NOVA_KEY_ALIAS" \
            --ks-pass env:NOVA_STORE_PASSWORD --key-pass env:NOVA_KEY_PASSWORD \
            --out dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk dist/aligned-universal.apk
          "$SIGNER" verify --min-sdk-version 23 --verbose --print-certs dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk
          python3 scripts/build_universal.py verify inputs/confirmed-arm32.apk inputs/official-universal.apk dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk
          sha256sum dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk | tee dist/SHA256SUMS.txt
          rm -f "$KEYSTORE"

      - name: Archive signed APK (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-V7.14-ThreeButtons-Universal-RemovableFirst-VerifierFixed-Signed
          path: |
            dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk
            dist/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create independent Universal Release (never overwrite previous assets)
        env:
          GH_TOKEN: ${{ secrets.NOVA_RELEASE_TOKEN || github.token }}
          GH_REPO: maerdelin/Nova-mod
        run: |
          set -euo pipefail
          TAG="v7.14-three-buttons-universal-removable-first-verifierfix-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          gh release create "$TAG" \
            dist/NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Nova V7.14 Three Buttons - Universal Four ABI (Run ${GITHUB_RUN_ID})" \
            --notes 'EXPERIMENTAL: SD/USB/OTHER removable volumes are added as top child folders of Local Storage root only (not home and not network). Tested locally with deterministic DEX-level and archive checks; Android Emulator / USB hardware runtime test is still required. The three-button home, WebDAV/SMB and other V7.14 resources are left unchanged. This fixes the earlier USB-only method by calling getExtSdcards, getExtUsbStorages and getExtOtherStorages. Only 176 bytes of the existing DEX method are replaced (in-place, unchanged method size). Native ABIs are from official Nova 6.5.5; signing key may require uninstalling existing differently-signed installs after backing up data.'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'NovaTV_V7_14_ThreeButtons_Universal_RemovableFirst_VerifierFixed.apk'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'

      - name: Keep at most three Releases - newest Universal, confirmed ARM32, tested V7.14
        env:
          GH_TOKEN: ${{ secrets.NOVA_RELEASE_TOKEN || github.token }}
          GH_REPO: maerdelin/Nova-mod
        run: |
          set -euo pipefail
          CURRENT="v7.14-three-buttons-universal-removable-first-verifierfix-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          KEEP_1='v7.14-three-buttons-run-38359455887-attempt-1'
          KEEP_2='v7.14-14tv-exact-run-38359455887-attempt-1'
          gh release view "$CURRENT" >/dev/null
          gh release view "$KEEP_1" >/dev/null
          gh release view "$KEEP_2" >/dev/null
          mapfile -t tags < <(gh api --paginate repos/maerdelin/Nova-mod/releases --jq '.[].tag_name')
          for tag in "${tags[@]}"; do
            if [[ "$tag" == "$CURRENT" || "$tag" == "$KEEP_1" || "$tag" == "$KEEP_2" ]]; then
              echo "KEEP $tag"
            else
              echo "DELETE superseded Release $tag"
              gh release delete "$tag" --yes
            fi
          done
          REMAINING="$(gh api repos/maerdelin/Nova-mod/releases --jq 'length')"
          test "$REMAINING" -le 3 || { echo "::error::More than three Releases left: $REMAINING"; exit 1; }
          echo "PASS: $REMAINING Releases retained; confirmed ARM32 and original tested V7.14 preserved"
