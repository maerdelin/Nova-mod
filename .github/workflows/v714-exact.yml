name: Nova V7.14 Tested ARM32 Baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-v714-exact-release
  cancel-in-progress: false

jobs:
  v714-baseline:
    name: Rebuild exact V7.14 tested reference without four-card patch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned reconstruction dependency
        run: |
          set -euo pipefail
          if ! command -v zstd; then sudo apt-get update && sudo apt-get install -y zstd; fi
          python3 -m py_compile scripts/v714_exact.py
          python3 -m unittest discover -s tests -v

      - name: Download pinned official Nova 6.5.5 ARM32 baseline
        run: |
          set -euo pipefail
          mkdir -p inputs dist
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output inputs/official.apk \
            'https://github.com/nova-video-player/aos-AVP/releases/download/v6.5.5/org.courville.nova-2672099-6.5.5-20261009.2113-armeabi-v7a-release.apk'
          echo '2912258dafe8e5bb7e057885b7e2228c581d8a30682ced87036ee11db409443e  inputs/official.apk' | sha256sum --check --strict

      - name: Reconstruct exact previously user-tested V7.14 APK
        run: |
          set -euo pipefail
          python3 scripts/v714_exact.py inputs/official.apk dist/NovaTV_V7_14_14TV_Exact.apk
          echo 'c9977d28e57b6a58e2f4d09da959a1b41db2028020d3175facfe792e108e77ff  dist/NovaTV_V7_14_14TV_Exact.apk' | sha256sum --check --strict
          test "$(stat -c %s dist/NovaTV_V7_14_14TV_Exact.apk)" -eq 29767890
          SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          "$SIGNER" verify --verbose --print-certs dist/NovaTV_V7_14_14TV_Exact.apk

      - name: Archive signed exact APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-V7.14-14TV-Exact-Baseline-Signed
          path: dist/NovaTV_V7_14_14TV_Exact.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish immutable per-run baseline Release
        env:
          GH_TOKEN: ${{ secrets.NOVA_RELEASE_TOKEN || github.token }}
          GH_REPO: maerdelin/Nova-mod
        run: |
          set -euo pipefail
          TAG="v7.14-14tv-exact-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          APK='dist/NovaTV_V7_14_14TV_Exact.apk'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Nova V7.14 Exact 14TV Tested Baseline (Run ${GITHUB_RUN_ID})" \
            --notes 'Reconstruction SHA-256 c9977d28e57b6a58e2f4d09da959a1b41db2028020d3175facfe792e108e77ff matches the prior user-tested 14TV V7.14 APK. Four-card early-return patch deliberately REMOVED because both ARM32 and Universal four-card candidates crashed. No claim that this individual new download was retested on hardware. Historic releases are never overwritten or deleted.'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'NovaTV_V7_14_14TV_Exact.apk'
