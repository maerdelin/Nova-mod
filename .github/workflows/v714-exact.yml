name: Nova V7.14 V6 - User Verified Network Centering
on:
  push:
    branches:
      - feature/v714-v10-mobile-ui-android-smoke-20261014
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-mobile-v10:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout mobile V10 test branch
        uses: actions/checkout@v4
      - name: Download SHA-pinned V6 baseline and apply V10 mobile patch
        run: |
          set -euo pipefail
          mkdir -p inputs dist
          python3 -m py_compile scripts/mobile_v10_binary_patch.py
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o inputs/v6.apk 'https://github.com/maerdelin/Nova-mod/releases/download/v7.14-v6-network-centered/NovaTV_V7_14_V6_NetworkCentered_Universal.apk'
          python3 scripts/mobile_v10_binary_patch.py inputs/v6.apk dist/v10-unsigned.apk
          python3 - <<'PY'
          import hashlib,zipfile
          with zipfile.ZipFile('dist/v10-unsigned.apk') as z:
            assert z.testzip() is None
            assert hashlib.sha256(z.read('classes.dex')).hexdigest()=='96b324978d5002fbedcf438fd9ac5a5df964ae57fc91e604652fb90162acab24'
            assert hashlib.sha256(z.read('res/Am.xml')).hexdigest()=='b246497606d126efa7e56156952bfd059538b9ffb18afb7a1c4cc44380293262'
            print('PASS exact V10 mobile DEX, proven V6 TV XML unchanged')
          PY
      - name: Zipalign and sign the candidate APK for emulator
        run: |
          set -euo pipefail
          ALIGN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -n1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          pass="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/nova-v10-test.jks" -alias test -keyalg RSA -keysize 3072 -validity 60 -dname 'CN=Nova V10 Emulator Test' -storepass "$pass" -keypass "$pass"
          "$ALIGN" -p -f 4 dist/v10-unsigned.apk dist/v10-aligned.apk
          "$SIGNER" sign --min-sdk-version 23 --v2-signing-enabled true --ks "$RUNNER_TEMP/nova-v10-test.jks" --ks-key-alias test --ks-pass "pass:$pass" --key-pass "pass:$pass" --out dist/v10-emulator.apk dist/v10-aligned.apk
          "$SIGNER" verify --min-sdk-version 23 --verbose dist/v10-emulator.apk
      - name: Allow Android KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 mobile/tablet install, launch, click checks, crash logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb install -r dist/v10-emulator.apk
            adb shell pm grant org.courville.nova android.permission.READ_EXTERNAL_STORAGE || true
            adb shell wm size 1280x800
            adb shell wm density 160
            adb logcat -c
            adb shell monkey -p org.courville.nova 1
            sleep 25
            adb shell pidof org.courville.nova
            adb shell screencap -p /sdcard/mobile_v10_home.png
            adb pull /sdcard/mobile_v10_home.png dist/mobile_v10_home.png
            adb shell uiautomator dump /sdcard/mobile_v10_home.xml
            adb pull /sdcard/mobile_v10_home.xml dist/mobile_v10_home.xml
            adb shell input tap 96 400
            sleep 8
            adb shell screencap -p /sdcard/mobile_v10_network.png
            adb pull /sdcard/mobile_v10_network.png dist/mobile_v10_network.png
            adb shell uiautomator dump /sdcard/mobile_v10_network.xml || true
            adb pull /sdcard/mobile_v10_network.xml dist/mobile_v10_network.xml || true
            adb shell pidof org.courville.nova
            adb logcat -b crash -d -v time > dist/v10_crash.log
            adb logcat -d -v time > dist/v10_full.log
            if grep -E 'FATAL EXCEPTION|VerifyError|NoSuchMethodError|NoSuchFieldError' dist/v10_crash.log; then
              echo "FAIL: mobile V10 android crash / verifier failure"
              exit 1
            fi
            echo "PASS: V10 installs, launches and network page opens without crash"
      - name: Upload V10 runtime evidence (not a public release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-V10-Mobile-Android-Emulator-Evidence
          path: |
            dist/v10-emulator.apk
            dist/mobile_v10_*.png
            dist/mobile_v10_*.xml
            dist/v10_*.log
          if-no-files-found: warn
          retention-days: 14
