name: NOVA 1097 inspect controller seek call graph
on:
  push:
    branches: ['fix/1097-mkv-403-release-only-seek-20261103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NOVA_1054_EXACT_1053_BASELINE: v6.6.2
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact original 6.6.2 APK and decode player controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools inputs
          curl -fL --retry 2 --connect-timeout 15 --max-time 60 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          python3 scripts/check_upstream.py download --apk inputs/official.apk --metadata inputs/upstream.json
          java -Xmx4g -jar tools/apktool.jar d --no-debug-info -f inputs/official.apk -o work/decoded
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('work/decoded')
          patterns=['PlayerController.smali','PlayerController$*.smali','PlayerActivity.smali','Player.smali']
          for pattern in patterns:
              matches=list(root.glob('smali*/com/archos/mediacenter/video/player/'+pattern))
              print('NOVA_1097_FILE',pattern,'count',len(matches))
              for p in matches[:12]:
                  src=p.read_text()
                  methods=re.findall(r'(?ms)^\.method [^\n]+\n.*?^\.end method',src)
                  selected=[m for m in methods if any(x in m.splitlines()[0].lower() for x in ('onkey(', 'onseek(', 'onseekanddraggingcomplete','isseekpressed','seekto(', 'onstoptrackingtouch','onstarttrackingtouch', 'onkeydown','onkeyup','sendfadeout','setnextseekpos','setprogress','handlemessage'))]
                  for m in selected[:14]:
                      lines=m.splitlines()
                      print('NOVA_1097_METHOD',p.name,lines[0], 'lines',len(lines))
                      for line in lines[:1400]:print('  '+line)
                      if len(lines)>1400:print('  ...TRUNCATED...')
          PY

      - name: Validate exact-size DPAD-only patch against real official 6.6.2 controller
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mkv_251_release_seek_patch.py scripts/startup_bbc_seek_fix_patch.py
          # Stub ONLY for isolated smali verification; the production build
          # gets the real JNI-backed DirectTransportProxy from direct_transport_apply.py.
          mkdir -p work/decoded/smali_classes4/com/archos/mediacenter/video/player
          cat > work/decoded/smali_classes4/com/archos/mediacenter/video/player/DirectTransportProxy.smali <<'SMALI'
          .class public final Lcom/archos/mediacenter/video/player/DirectTransportProxy;
          .super Ljava/lang/Object;
          .method public static native isNonIsoDirectWebdav()Z
          .end method
          .method public static native nativeIsWebdavMkv()Z
          .end method
          SMALI
          python3 scripts/mkv_251_release_seek_patch.py --decoded work/decoded
          grep -Fq 'nova251OnSeekSpinner' work/decoded/smali*/com/archos/mediacenter/video/player/PlayerController.smali
          grep -Fq 'nova251_activity_suppressed' work/decoded/smali*/com/archos/mediacenter/video/player/PlayerActivity\$1.smali
          grep -Fq 'nova251BeginHold' work/decoded/smali*/com/archos/mediacenter/video/player/PlayerController.smali
          grep -Fq 'nova251HoldTick' 'work/decoded/smali_classes3/com/archos/mediacenter/video/player/PlayerController$8.smali' || grep -R -Fq 'nova251HoldTick' work/decoded/smali*/com/archos/mediacenter/video/player/PlayerController\$8.smali
          java -Xmx4g -jar tools/apktool.jar b work/decoded -o work/1097-verified-smali.apk
          test -s work/1097-verified-smali.apk
          echo 'NOVA_1097_ORIGINAL_CONTROLLER_APKTOOL_BUILD=PASS'
