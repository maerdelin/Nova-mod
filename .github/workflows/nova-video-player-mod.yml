name: Nova Video Player mod
on:
  workflow_dispatch:
  push:
    branches: ['ci/granular-patches-20261015']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact reference and verified disassembler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p audit
          python3 - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          m=json.loads(Path('baseline/manifest.json').read_text())
          subprocess.run(['curl','-fL','--retry','4','-o','audit/official.apk',m['upstream_url']],check=True)
          assert hashlib.sha256(Path('audit/official.apk').read_bytes()).hexdigest()==m['upstream_sha256']
          PY
          curl -fL --retry 4 -o audit/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  audit/apktool.jar' | sha256sum -c -
          python3 scripts/build.py build audit/official.apk audit/modified.apk
      - name: Decode reference and complete stable mod
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar audit/apktool.jar d --no-debug-info -f audit/official.apk -o old > audit/decode-official.log 2>&1
          java -Xmx4g -jar audit/apktool.jar d --no-debug-info -f audit/modified.apk -o mod > audit/decode-mod.log 2>&1
      - name: Export exact differences and local analysis inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,zipfile,shutil,difflib
          from pathlib import Path
          a=Path('old');b=Path('mod'); out=Path('audit')
          names={p.relative_to(a).as_posix() for p in a.rglob('*') if p.is_file()}|{p.relative_to(b).as_posix() for p in b.rglob('*') if p.is_file()}
          changed=[];diff=[]
          for n in sorted(names):
              x=a/n;y=b/n
              xb=x.read_bytes() if x.exists() else None;yb=y.read_bytes() if y.exists() else None
              if xb==yb:continue
              changed.append({'path':n,'old_size':len(xb) if xb is not None else None,'new_size':len(yb) if yb is not None else None})
              for side,p in [('old',x),('mod',y)]:
                  if p.exists():
                      q=out/side/n;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
              if n.endswith(('.smali','.xml','.yml')) and not n.startswith('original/'):
                  diff.extend(difflib.unified_diff((xb or b'').decode().splitlines(True),(yb or b'').decode().splitlines(True),fromfile='old/'+n,tofile='mod/'+n))
          (out/'decoded-differences.json').write_text(json.dumps(changed,indent=2))
          (out/'decoded.diff').write_text(''.join(diff))
          for side,base in [('old',a),('mod',b)]:
              p=out/side/'res/values/public.xml';p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(base/'res/values/public.xml',p)
          with zipfile.ZipFile('audit/official.apk') as x,zipfile.ZipFile('audit/modified.apk') as y:
              sig=lambda n:n=='META-INF/MANIFEST.MF' or n.startswith('META-INF/') and n.upper().endswith(('.SF','.RSA','.DSA','.EC'))
              nx=set(x.namelist());ny=set(y.namelist());r=[]
              for n in sorted(nx|ny):
                  if sig(n):continue
                  xb=x.read(n) if n in nx else None;yb=y.read(n) if n in ny else None
                  if xb!=yb:r.append({'path':n,'old_sha256':hashlib.sha256(xb).hexdigest() if xb is not None else None,'new_sha256':hashlib.sha256(yb).hexdigest() if yb is not None else None})
              (out/'apk-differences.json').write_text(json.dumps(r,indent=2))
          shutil.copyfile('baseline/manifest.json','audit/baseline-manifest.json')
          print(json.dumps(changed,indent=2))
          print('APK differences:',len(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nova-granular-analysis
          path: audit/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
