name: Nova Video Player mod

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: ['fix/393-seek-exit-anr-20261106', 'upgrade/nova-v6.6.4-official-20261105', 'test/939-seek-pool-forensics', 'test/940-shared-mkv-zero-copy-integrity', 'test/946-shared42-backpressure-resume', 'test/947-loading-prepared-diagnostics', 'test/950-boot-deep-telemetry', 'test/956-onepass-startup-speed', 'test/961-four-startup-fixes', 'test/962-deep-startup', 'test/967-60fps-clock-evidence-20261031', 'fix/tv-webdav-list-holder-field-20261031', 'feat/977-early-buffer-canonical-first-20261031', 'feat/mkv-staged-firstframe-64k-20261031', 'fix/985-mkv-staged-real-runtime-gate-20261031', 'fix/989-staged-final-gate-20261031', 'feat/990-iso-256k-firstframe-early-w2-20261031', 'build/994-all-five-validation-20261031', 'fix/1022-early-percent-full60fps-forensics-20261101', 'fix/1035-all-formats-first-x-locked-20261101', 'fix/1049-final-three-20261101', 'fix/1053-iso-validated-pump-20261101', 'fix/1054-warehouse-reopen-20261101', 'fix/1064-iso-memory-liveness-20261102', 'diag/1073-iso-first-cause-blackbox-20261102', 'fix/1074-subtitle-egl-ui-exit-20261102', 'fix/1088-mkv-fast-preview-20261102', 'test/925-shared42-zero-copy', main, Test, Always-new, 'fix/1097-mkv-403-release-only-seek-20261103', 'fix/1119-progress-size-all-three-20261103', 'feat/always-new-global-logs-toggle-20261103', 'fix/global-logs-complete-gating-20261103', 'fix/global-logs-1200-source-only-review-20261104', 'fix/v662-precise-keyframe-backseek-20261028', 'fix/v662-ts-eof-pcm-leadgate-20261028', 'fix/main-startup-seek-only-20261028', 'ci/full-latest-6_6_2-20261028', 'ci/alwaysnew-precise-seek-dual2-20261029', 'ci/alwaysnew-dual2-http403-recovery-20261029', 'ci/alwaysnew-dual2-keepalive-range-20261029', 'ci/alwaysnew-dual2-hardening-20261029']

permissions:
  contents: write

concurrency:
  group: nova-video-player-mod-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/fix/1035-all-formats-first-x-locked-20261101' || github.ref == 'refs/heads/fix/1054-warehouse-reopen-20261101' || github.ref == 'refs/heads/fix/1064-iso-memory-liveness-20261102' || github.ref == 'refs/heads/diag/1073-iso-first-cause-blackbox-20261102' || github.ref == 'refs/heads/fix/1074-subtitle-egl-ui-exit-20261102' || github.ref == 'refs/heads/fix/1088-mkv-fast-preview-20261102' || github.ref == 'refs/heads/fix/1097-mkv-403-release-only-seek-20261103' || github.ref == 'refs/heads/fix/1119-progress-size-all-three-20261103' || github.ref == 'refs/heads/fix/global-logs-complete-gating-20261103' }}

jobs:
  build:
    env:
      NOVA_1054_EXACT_1053_BASELINE: ${{ (github.ref == 'refs/heads/upgrade/nova-v6.6.4-official-20261105' || github.ref == 'refs/heads/Always-new' || github.ref == 'refs/heads/fix/393-seek-exit-anr-20261106' || github.ref == 'refs/heads/main') && 'none' || 'v6.6.2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare tools and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          # Install only tools missing from the runner to avoid apt stalls.
          missing=()
          for spec in zstd:zstd git:git make:make mvn:maven cc:build-essential wget:wget curl:curl unzip:unzip pkg-config:pkg-config ninja:ninja-build; do
            bin="${spec%%:*}"
            pkg="${spec#*:}"
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing+=("$pkg")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf "CI preflight: missing packages: %s\n" "${missing[*]}"
            timeout 120s sudo apt-get update -qq
            timeout 240s sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          else
            echo 'CI preflight: required build tools are already installed'
          fi
          # GitHub apt mirrors timed out twice installing meson+ffmpeg (exit 124).
          # Isolate pinned host-only build tools; do not alter APK dependencies.
          if ! command -v meson >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            echo 'CI preflight: provision pinned Meson and FFmpeg without apt'
           python3 -m venv .nova-ci-deps
            timeout 180s .nova-ci-deps/bin/python -m pip install --disable-pip-version-check --no-input --no-cache-dir 'meson==1.7.0' 'imageio-ffmpeg==0.6.0'
            mkdir -p .nova-ci-bin
            ln -s "$PWD/.nova-ci-deps/bin/meson" .nova-ci-bin/meson
            ffmpeg_exe="$(.nova-ci-deps/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            test -x "$ffmpeg_exe"
            ln -s "$ffmpeg_exe" .nova-ci-bin/ffmpeg
            export PATH="$PWD/.nova-ci-bin:$PATH"
            echo "$PWD/.nova-ci-bin" >> "$GITHUB_PATH"
          fi
          meson --version
          ffmpeg -version | head -n 1
          mkdir -p inputs dist tools work reports
          python3 -m py_compile scripts/global_logs_native_coverage_patch.py scripts/audit_global_logs_smali.py scripts/smoke_global_logs_native_off.py scripts/smoke_global_logs_off_iso_ui.py scripts/global_logs_1199_patch.py scripts/global_logs_smali_1199_patch.py
          python3 -m unittest discover -s tests -p test_global_logs_hardening.py -v
          python3 -m unittest discover -s tests -p test_global_logs_playback_decouple.py -v
          python3 -m unittest discover -s tests -p test_global_logs_sampling_1197.py -v
          python3 -m unittest discover -s tests -p test_global_logs_1199.py -v
          python3 scripts/direct_transport_audit.py --source --require-removed
          python3 -m unittest discover -s tests -p test_iso_metadata_cache.py -v
          python3 -m unittest discover -s tests -p test_direct_transport_lifecycle.py -v
          python3 -m unittest discover -s tests -p test_torrent_crash_guard_patch.py -v
          python3 -m unittest discover -s tests -p test_literange4.py -v
          python3 -m unittest discover -s tests -p test_shared42_page_view_native.py -v
          python3 -m unittest discover -s tests -p test_shared42_backpressure.py -v
          python3 -m unittest discover -s tests -p test_literange4_keepalive.py -v
          python3 -m unittest discover -s tests -p test_literange4_hardening.py -v
          python3 -m unittest discover -s tests -p test_60fps_clock_evidence.py -v
          python3 -m unittest discover -s tests -p test_startup_freeze_trace.py -v
          python3 -m unittest discover -s tests -p test_redirect_timeout_classifier.py -v
          python3 -m unittest discover -s tests -p test_mp4_seek_verification.py -v
          python3 -m unittest discover -s tests -p test_iso_metadata_cache.py -v
          python3 -m unittest discover -s tests -p test_iso_index_seek_v2.py -v
          python3 -m unittest discover -s tests -p test_iso_track_language_metadata.py -v
          python3 -m unittest discover -s tests -p test_tv_track_width_patch.py -v
          python3 -m unittest discover -s tests -p test_tv_first_focus_layout.py -v
          python3 -m unittest discover -s tests -p test_tv_small_card_spacing_patch.py -v
          python3 -m unittest discover -s tests -p test_tv_list_view_field.py -v
          python3 -m unittest discover -s tests -p test_webdav_resume_local_only_patch.py -v
          python3 -m unittest discover -s tests -p test_weak_start_proxy.py -v
          python3 -m unittest discover -s tests -p test_noniso_startup_zero_seek.py -v
          python3 -m unittest discover -s tests -p test_main_startup_seek_only.py -v
          python3 -m unittest discover -s tests -p test_weak_network_native.py -v
          python3 -m unittest discover -s tests -p test_mp4_tail_moov_equivalence.py -v
          python3 -m unittest discover -s tests -p test_noniso_seek_avio.py -v
          python3 -m unittest discover -s tests -p test_redirect_freshness.py -v
          python3 -m unittest discover -s tests -p test_mkv_bbc_seek_regression.py -v
          python3 -m unittest discover -s tests -p test_1097_mkv251_release_seek.py -v
          python3 -m unittest discover -s tests -p test_1119_resumed_file_size.py -v
          python3 -m unittest discover -s tests -p test_startup_freeze_trace.py -v
          python3 -m unittest discover -s tests -p test_startup_onepass_speed.py -v
          python3 -m unittest discover -s tests -p test_startup_mkv_canonical_first.py -v
          python3 -m unittest discover -s tests -p test_startup_fourfix.py -v
          python3 -m unittest discover -s tests -p test_994_source_guards.py -v
          python3 -m unittest discover -s tests -p test_994_percent_native.py -v
          python3 -m unittest discover -s tests -p test_1052_final_three.py -v
          python3 -m unittest discover -s tests -p test_1053_iso_demux_regression.py -v
          python3 -m unittest discover -s tests -p test_1054_warehouse_reopen.py -v
          python3 -m unittest discover -s tests -p test_1064_iso_memory_liveness.py -v
          python3 -m unittest discover -s tests -p test_1073_iso_blackbox.py -v
          python3 -m unittest discover -s tests -p test_1074_subtitle_async_exit.py -v
          python3 -m py_compile scripts/subtitle_1074_async_exit_patch.py
          python3 -m py_compile scripts/iso_1073_avos_patch.py
          python3 -m py_compile scripts/iso_hw_cbe_reliability_patch.py
           python3 -m unittest discover -s tests -p test_1035_all_formats_x_lock.py -v
           python3 -m unittest discover -s tests -p test_1018_final_four.py -v
          python3 -m py_compile scripts/startup_loading_994_patch.py
          python3 -m py_compile scripts/mkv_bbc_cue_seek_patch.py scripts/iso_track_metadata_patch.py scripts/smoke_noniso_single_get_android.py scripts/mkv_251_release_seek_patch.py scripts/startup_bbc_seek_fix_patch.py
          python3 -m py_compile scripts/torrent_crash_guard_patch.py
          python3 -m py_compile scripts/startup_loading_diag_patch.py scripts/startup_onepass_speed_patch.py
           python3 -m py_compile scripts/granular.py scripts/granular_build.py scripts/direct_transport_native_patch.py scripts/direct_transport_apply.py scripts/direct_transport_audit.py scripts/webdav_credential_coldboot_patch.py scripts/smoke_direct_webdav.py scripts/av_diag_patch.py scripts/startup_freeze_trace_patch.py scripts/final_freeze_forensics_patch.py scripts/pgs_history_bypass_ab_patch.py scripts/mp4_seek_slow_read_grace_patch.py scripts/seek_priority_patch.py scripts/seek_cache_window_patch.py scripts/seek_video_index_patch.py scripts/smoke_mp4_raw_seek_race.py scripts/disable_all_subtitle_history_patch.py scripts/late_stall_self_heal_patch.py scripts/seek_safe_serial_v2_patch.py scripts/seek_engine_diag_patch.py scripts/seek_sfdec2_frame_return_patch.py scripts/seek_codec_pool_diag_patch.py scripts/iso_index_seek_patch.py scripts/libbluray_iso_index_patch.py scripts/fix_resumed_file_size_1119.py
          python3 -m py_compile scripts/fix_run393_exit_anr.py
          python3 -m unittest discover -s tests -p test_run393_exit_anr.py -v
          python3 -m py_compile scripts/global_logs_smali_patch.py scripts/global_logs_native_patch.py scripts/strict_idle_hotpaths_1133.py scripts/smoke_global_logs_settings.py scripts/startup_staged_decode_patch.py scripts/smoke_startup_mkv_canonical_first.py scripts/smoke_994_ui_runtime.py scripts/smoke_994_mkv_compare.py
          python3 -m py_compile scripts/tv_small_card_spacing_patch.py scripts/webdav_resume_local_only_patch.py scripts/smoke_webdav_resume_local_only.py scripts/smoke_literange4_concurrency.py scripts/smoke_literange4_http403.py scripts/smoke_literange4_http429.py scripts/smoke_literange4_keepalive.py scripts/smoke_literange4_http403_repeat.py scripts/smoke_startup_mkv_canonical_first.py
          echo 'CI preflight: apktool download (max 120s)'
          timeout 120s curl -fL --retry 2 --connect-timeout 15 --max-time 45 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Resolve verified official APK (1054 exact-1053 baseline; others latest)
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py download --apk inputs/official.apk --metadata inputs/upstream.json

      - name: Require verified official v6.6.4 release APK and all-source manifest
        if: (github.ref == 'refs/heads/upgrade/nova-v6.6.4-official-20261105' || github.ref == 'refs/heads/Always-new' || github.ref == 'refs/heads/fix/393-seek-exit-anr-20261106' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/official_release_sources.py download \
            --metadata inputs/upstream.json --apk inputs/official.apk \
            --manifest work/official-v664-release-manifest.xml \
            --report reports/official-v664-source-asset.json

      - name: Inspect original TV popup focus and animation smali
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar tools/apktool.jar d --no-debug-info -f inputs/official.apk -o work/tv-forensics
          python3 scripts/tv_focus_forensics.py work/tv-forensics reports/tv-focus-forensics
          test -s reports/tv-focus-forensics/original/TVCardView.smali.txt
          test -s 'reports/tv-focus-forensics/original/TVCardView$ExpandAnimation.smali.txt'
          test -s reports/tv-focus-forensics/original/TVMenuAdapter.smali.txt

      - name: Verify original APK signature
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$SIGNER" verify --verbose --print-certs inputs/official.apk > reports/official-signature.txt

      - name: Build patched AVOS native rebuffer core
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?ANDROID_NDK_LATEST_HOME is not set}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          mkdir -p native-src
          cd native-src
          # Derive native manifest from the ACTUALLY selected official latest stable release.
          # The CI fails rather than reusing old AVOS when the official minor version changes.
          official_manifest="$(python3 ../scripts/official_native_manifest.py ../inputs/upstream.json)"
          echo "Official source manifest: $official_manifest"
          curl -fsSL --retry 3 -o ../work/official-native-manifest.xml "https://raw.githubusercontent.com/nova-video-player/aos-AVP/nova/$official_manifest"
          test -s ../work/official-native-manifest.xml
          # Fail closed for unported major/minor source revisions. v6.6 is validated;
          # future versions must be deliberately ported rather than silently using v6.6.
          if [[ "$official_manifest" != "v6_6.xml" ]]; then
            echo "::error::Official $official_manifest requires native patch source port before publishing"
            exit 1
          fi
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m "$official_manifest"
          if [ "$GITHUB_REF_NAME" = "upgrade/nova-v6.6.4-official-20261105" ] || [ "$GITHUB_REF_NAME" = "Always-new" ] || [ "$GITHUB_REF_NAME" = "fix/393-seek-exit-anr-20261106" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            mkdir -p .repo/local_manifests
            python3 ../scripts/official_release_sources.py overlay \
              --metadata ../inputs/upstream.json \
              --manifest ../work/official-v664-release-manifest.xml \
              --output .repo/local_manifests/official-v664-pinned.xml
          fi
          repo sync -j 4
          if [ "$GITHUB_REF_NAME" = "upgrade/nova-v6.6.4-official-20261105" ] || [ "$GITHUB_REF_NAME" = "Always-new" ] || [ "$GITHUB_REF_NAME" = "fix/393-seek-exit-anr-20261106" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            python3 ../scripts/official_release_sources.py verify \
              --metadata ../inputs/upstream.json \
              --manifest ../work/official-v664-release-manifest.xml \
              --root . \
              --report ../reports/official-v664-source-revisions.json
          fi
          # 60fps evidence-only build: pin EXACT #967 successful AVOS source.
          # Moving v6.6 upstream broke #968 at source patch apply time.
          # Here the ONLY production changes are observational clock/CPU/page
          # telemetry. Do not change audio/decoder/RAW/W2 download behavior.
          if [ "$GITHUB_REF_NAME" = "upgrade/nova-v6.6.4-official-20261105" ] || [ "$GITHUB_REF_NAME" = "Always-new" ] || [ "$GITHUB_REF_NAME" = "fix/393-seek-exit-anr-20261106" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            git -C native/avos rev-parse HEAD | tee ../reports/upstream-avos-head.txt
            echo 'NOVA_V664_AVOS_EXACT_OFFICIAL_RELEASE_SOURCE=PASS'
          else
            if ! git -C native/avos cat-file -e d4abfdf075d4f7bfdee9a47cb2c02067f92f47cd^{commit}; then
              git -C native/avos fetch --no-tags origin d4abfdf075d4f7bfdee9a47cb2c02067f92f47cd
            fi
            git -C native/avos checkout --detach d4abfdf075d4f7bfdee9a47cb2c02067f92f47cd
            test "$(git -C native/avos rev-parse HEAD)" = d4abfdf075d4f7bfdee9a47cb2c02067f92f47cd
            git -C native/avos rev-parse HEAD | tee ../reports/upstream-avos-head.txt
            echo 'NOVA_60FPS_EVIDENCE_AVOS_967_PINNED=PASS'
          fi
          cd ..
          python3 scripts/v66_subtitle_jni_patch.py --native native-src/native/avos
          python3 scripts/subtitle_1074_async_exit_patch.py --native native-src/native/avos
          grep -Fq 'NOVA_1074_EGL_RETIRE_ASYNC' native-src/native/avos/Source/sub_engine_registry.c
          grep -Fq 'NOVA_1074_EGL_JOIN_BEGIN' native-src/native/avos/Source/sub_render_gl.c
          python3 scripts/native_rebuffer_patch.py native-src/native/avos --allow-unpinned-head --report reports/native-rebuffer.json
          python3 scripts/direct_transport_native_patch.py native-src/native/avos --report reports/direct-transport-native.json
          python3 scripts/shared42_native_patch.py --native native-src/native/avos
          python3 scripts/shared42_pool_audit_v2_patch.py --transport iso/nova_transport.c
          python3 scripts/playback_completion_patch.py native-src/native/avos --report reports/playback-completion-native.json
          python3 scripts/main655_ts_eof_lead_gate.py --native native-src/native/avos --report reports/main655-ts-eof-leadgate.json
          python3 scripts/ts_bitrate_patch.py native-src/native/avos --report reports/ts-bitrate.json
          python3 scripts/ts_resume_fallback_patch.py native-src/native/avos --report reports/ts-resume-fallback.json
          python3 scripts/iso_fast_probe_patch.py native-src/native/avos --report reports/iso-fast-probe.json
          python3 scripts/iso_seek_ui_patch.py --native native-src/native/avos --report reports/iso-timeline.json
          python3 scripts/av_diag_patch.py --native native-src/native/avos --report reports/av-diagnostics.json
          python3 scripts/startup_freeze_trace_patch.py --native native-src/native/avos --report reports/startup-freeze-trace.json
          python3 scripts/final_freeze_forensics_patch.py --native native-src/native/avos --report reports/final-freeze-forensics.json
          python3 scripts/pgs_history_bypass_ab_patch.py --native native-src/native/avos --report reports/pgs-history-bypass-ab.json
          python3 scripts/mp4_seek_slow_read_grace_patch.py --native native-src/native/avos --report reports/mp4-seek-slow-read-grace.json
          # Strictly revert unsafe Test-only seek experiments. Keep the
          # proven RUN638 network/seek path and unchanged 1.5X low / 3X resume thresholds.
          if grep -Eq 'seek_preempt|NOVA_RAW_CACHE_SEEK_V1|NOVA_FAST_VIDEO_INDEX_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c; then echo '::error::Experimental Seek path still present'; exit 1; fi
          python3 scripts/disable_all_subtitle_history_patch.py --native native-src/native/avos --report reports/all-subtitle-history-disabled.json
          python3 scripts/late_stall_self_heal_patch.py --native native-src/native/avos --report reports/late-render-recovery.json
          python3 scripts/seek_sfdec2_frame_return_patch.py --native native-src/native/avos
          grep -Fq 'NOVA_SFDEC2_NO_OUTPUT_RETURN_V1' native-src/native/avos/Source/codec_sfdec2.c
          python3 scripts/seek_engine_diag_patch.py --native native-src/native/avos
          python3 scripts/seek_stall_forensics_v2_patch.py --native native-src/native/avos
          python3 scripts/seek_codec_pool_diag_patch.py --native native-src/native/avos
          grep -Fq 'NOVA_SUB_HISTORY_DISABLED_ALL_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_LATE_STALL_SELF_HEAL_V1' native-src/native/avos/Source/codec_sfdec2.c
          if grep -Eq '_cache_subtitle_packet\(|_subtitle_recovery_point\(' native-src/native/avos/Source/stream_parser_ffmpeg.c; then echo '::error::History code still compiled'; exit 1; fi
          grep -Fq 'NOVA_MP4_SEEK_SLOW_READ_GRACE_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          # ISO-only root fix: use non-mutating libbluray CLPI index lookup,
          # preserving the RAW producer position and FFmpeg fallback.
          python3 scripts/iso_index_seek_patch.py --native native-src/native/avos --transport iso/nova_transport.c
          # MKV-only Cues/backward seek is intentionally applied AFTER ISO patch.
          # The ISO CLPI path and all non-MKV fallback branches stay untouched.
          python3 scripts/mkv_bbc_cue_seek_patch.py --native native-src/native/avos
          python3 scripts/iso_track_metadata_patch.py --native native-src/native/avos
          python3 scripts/startup_bbc_seek_fix_patch.py --native native-src/native/avos --report reports/startup-bbc-seek-fix.json
          grep -Fq 'NOVA_MKV_403_RECOVERED_INDEX_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          NOVA_PATCHED_AVOS_ROOT="$PWD/native-src/native/avos" python3 -m unittest discover -s tests -p test_startup_bbc_seek_native.py -v
          grep -Fq 'NOVA_STARTUP_AUDIO_NO_TIMELINE_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'return stream_parser_set_audio_stream( s, audio_stream);' native-src/native/avos/Source/stream_parser_ffmpeg.c
          python3 scripts/precise_seek_patch.py --native native-src/native/avos --report reports/precise-seek.json
          NOVA_PATCHED_AVOS_ROOT="$PWD/native-src/native/avos" python3 -m unittest discover -s tests -p test_precise_seek_native.py -v
          grep -Fq 'NOVA_MKV_FAST_PREVIEW_V1' native-src/native/avos/Source/stream_video.c
          grep -Fq 'NOVA_ISO_TRACK_APPLIED_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_BBC_CUE_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_SEEK_SCAN_BEGIN_V2' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_SEEK_DONE_V2' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_ISO_INDEX_SEEK_V3' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_ISO_INDEX_MAP_V3' iso/nova_transport.c
          python3 scripts/startup_boot_raw_diag.py --native native-src/native/avos
          python3 scripts/startup_onepass_speed_patch.py --native native-src/native/avos
          python3 scripts/startup_staged_decode_patch.py --native native-src/native/avos
          python3 scripts/iso_hw_cbe_reliability_patch.py --native native-src/native/avos
          python3 scripts/iso_1073_avos_patch.py --native native-src/native/avos
          python3 scripts/global_logs_native_patch.py --native native-src/native/avos --transport iso/nova_transport.c
          python3 scripts/global_logs_native_coverage_patch.py --native native-src/native/avos --transport iso/nova_transport.c
          python3 scripts/global_logs_sampling_1197_patch.py --transport iso/nova_transport.c --lite iso/nova_literange4.inc
          python3 scripts/global_logs_1199_patch.py --native native-src/native/avos --transport iso/nova_transport.c --lite iso/nova_literange4.inc
          # Run393: genuine player destruction preempts the exact transport generation.
          # No ordinary Seek cancellation and all diagnostics share the global Logs toggle.
          python3 scripts/fix_run393_exit_anr.py --native native-src/native/avos --lite iso/nova_literange4.inc --report reports/run393-exit-anr.json
          grep -Fq 'NOVA_393_EARLY_TRANSPORT_ABORT_V1' native-src/native/avos/Source/avos_mp.c
          grep -Fq 'CURLOPT_XFERINFOFUNCTION,nova_393_shutdown_progress' iso/nova_literange4.inc
          grep -Fq 'NOVA_1199_FFMPEG_CAPTURE_GATE' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'nova_ffmpeg_log_sync();' native-src/native/avos/Source/stream_video.c
          grep -Fq 'if(nova_global_log_enabled()) p->owner->received_sample_bytes' iso/nova_literange4.inc
          grep -Fq 'NOVA_GLOBAL_LOGS_TOGGLE_V1' native-src/native/avos/Include/log.h
          grep -Fq 'NOVA_GLOBAL_LOGS_TOGGLE_V1' iso/nova_transport.c
          grep -Fq 'nova_global_log_enabled' native-src/native/avos/Include/nova_global_gate_impl.inc
          grep -Fq 'NOVA_1052_ISO_HW_CBE_V1' native-src/native/avos/Source/stream_video.c
          grep -Fq 'NOVA_1052_ISO_HW_ONLY_V1' native-src/native/avos/Source/stream_video.c
          grep -Fq 'NOVA_60FPS_SYSTEM_FORENSICS_V2' native-src/native/avos/Source/stream_video.c
          grep -Fq 'nova_60fps_note_late' native-src/native/avos/Source/codec_sfdec2.c
          grep -Fq 'nova_startup_overlay_raw_percent' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_FIRST_RENDER_HOLD_V1' native-src/native/avos/Source/stream_video.c
          grep -Fq 'NOVA_STAGED_DECODE_64K_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_STARTUP_ONEPASS_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_STARTUP_FOURFIX_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_BOOT_RAW_SOURCE' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_BOOT_RAW_CONSUMER' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_BOOT_RAW_SEEK' native-src/native/avos/Source/stream_parser_ffmpeg.c
          # Upstream prebuilt-ffmpeg v8_0 currently ships dist-full-* only.
          # AVOS base/full differ only by which FFmpeg directory is linked; no
          # AVOS source feature macro depends on LIBAV_CONFIG. Alias the same
          # FFmpeg 8.0 ABI into the base path, then keep ONLY rebuilt libavos.so.
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "native-src/native/prebuilt/ffmpeg/dist-full-$abi/lib/libavcodec.so"
            if [[ ! -e "native-src/native/prebuilt/ffmpeg/dist-base-$abi" ]]; then
              ln -s "dist-full-$abi" "native-src/native/prebuilt/ffmpeg/dist-base-$abi"
            fi
          done
          echo 'NOVA_V66_FFMPEG_PATCHED_LINES_3090_3180_BEGIN'
          nl -ba native-src/native/avos/Source/stream_parser_ffmpeg.c | sed -n '3090,3180p'
          echo 'NOVA_V66_FFMPEG_PATCHED_LINES_END'
          cd native-src
          MAKE_JOBS=4 BUILD=release make native_build_native/libnativehelper
          MAKE_JOBS=4 BUILD=release make native_avos_base
          cd ..
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          mkdir -p work/official-native
          {
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              new="native-src/native/avos/libs/$abi/libavos.so"
              old="work/official-native/libavos-$abi.so"
              test -s "$new"
              jni="native-src/native/avos/libs/$abi/libavosjni.so"
              test -s "$jni"
              if ! "$NM" -D "$jni" | grep -F ' Java_com_archos_mediacenter_video_player_SubtitleEngine_nativeCreate'; then
                echo "::error::Official v6.6 SubtitleEngine.nativeCreate JNI missing from $abi rebuilt libavosjni.so"
                exit 1
              fi
              if ! "$NM" -D "$new" | grep -F ' sub_engine_create'; then
                echo "::error::Official v6.6 subtitle core missing from $abi libavos.so"
                exit 1
              fi
              for trace in NOVA_SYNC_PUT NOVA_SYNC_RENDER_CLOCK NOVA_SYNC_LATE NOVA_SYNC_SEEK_RESET NOVA_SYNC_PCM_CORRECTION NOVA_SYNC_AUDIO_START NOVA_FINAL_HEARTBEAT NOVA_FINAL_PARSER_QUEUE NOVA_FINAL_RENDER_Q NOVA_SUB_HISTORY_DISABLED_ALL_V1 NOVA_LATE_STALL_SELF_HEAL_V1 NOVA_SEEK_ENGINE_DIAG_V1 NOVA_SEEK_POOL_OWNERS_V1 NOVA_MKV_SEEK_SCAN_BEGIN_V2 NOVA_MKV_BBC_SEEK_STOP_V1 NOVA_ISO_TRACK_APPLIED_V1 NOVA_ISO_CODEC_AUDIT_V2 NOVA_ISO_CODEC_LABEL_V2 NOVA_STARTUP_NATIVE_ZERO_SKIP_V2 NOVA_MKV_SEEK_REJECT_V3 NOVA_MKV_SEEK_POSITION_V3 NOVA_PRECISE_SEEK_BEGIN_V1 NOVA_PRECISE_SEEK_DONE_V1; do
                if ! grep -aq "$trace" "$new"; then
                  echo "::error::Missing $trace instrumentation from $abi libavos.so"
                  exit 1
                fi
              done
              unzip -p inputs/official.apk "lib/$abi/libavos.so" > "$old"
              test -s "$old"
              new_needed="$("$READELF" -d "$new" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort)"
              old_needed="$("$READELF" -d "$old" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort)"
              if [[ "$new_needed" != "$old_needed" ]]; then
                echo "::error::DT_NEEDED mismatch for $abi"
                diff -u <(printf '%s\n' "$old_needed") <(printf '%s\n' "$new_needed") || true
                exit 1
              fi
              sha256sum "$new"
            done
          } | tee reports/native-libavos-sha256.txt

      - name: Build unified direct native transport
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?ANDROID_NDK_LATEST_HOME is not set}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash scripts/build_transport_native.sh work/transport-native
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            transport="work/transport-native/$abi/libnova_transport.so"
            avos="native-src/native/avos/libs/$abi/libavos.so"
            for marker in NOVA_1073_BB_WATCHDOG_STARTED nova_transport_diag_external NOVA_1073_BB_FIRST_ANOMALY NOVA_1073_ISO_FIRST_FRAME_READY; do
              if ! LC_ALL=C grep -aFq "$marker" "$transport"; then
                echo "::error::1073 transport binary missing $marker in $abi"
                echo "SHA=$(sha256sum "$transport")"
                exit 1
              fi
              echo "NOVA_1073_MARKER_OK abi=$abi module=transport marker=$marker"
            done
            if LC_ALL=C grep -aFq 'nova_1073_external' "$avos" || LC_ALL=C grep -aFq 'nova_transport_diag_external' "$avos"; then
              echo "NOVA_1073_MARKER_OK abi=$abi module=avos bridge=1"
            else
              echo "::error::1073 AVOS bridge missing in $abi"
              exit 1
            fi
          done
          # Run681 regression: four-ABI ELF marker checks for FILE-only fix.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -aq 'NOVA_FILE_SEEK_RECOVERED' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_FILE_FRESH_RANGE_V1' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_STARTUP_CURL_CANCEL' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_STARTUP_REDIRECT_INCOMPATIBLE' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_STARTUP_FIRST206_READY' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_NONISO_AVIO_UNLATCH_V1' "native-src/native/avos/libs/$abi/libavos.so" || exit 1
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            transport="work/transport-native/$abi/libnova_transport.so"
            avos="native-src/native/avos/libs/$abi/libavos.so"
            for marker in NOVA_ISO_PARALLEL_V1 NOVA_ISO_STARTUP_REPLAY_V1 NOVA_MKV_TAIL_WARM_V1 NOVA_STARTUP_UI_PHASE_V1; do
              grep -aq "$marker" "$transport" || { echo "::error::994 native missing: $marker ($abi)"; exit 1; }
            done
            grep -aq NOVA_STARTUP_BUFFER_PREARM_V1 "$avos" || { echo "::error::994 buffering arm missing $abi"; exit 1; }
            grep -aq NOVA_60FPS_SYSTEM_FORENSICS_V2 "$avos" || { echo "::error::60fps deep system sampler missing $abi"; exit 1; }
            grep -aq NOVA_EARLY_PERCENT_V2 "$transport" || { echo "::error::first-byte progress missing $abi"; exit 1; }
          done
          grep -Fq 'NOVA_ISO_META_STAIR_V1' iso/nova_transport.c
          grep -Fq 'NOVA_ISO_EARLY_W2_V1' iso/nova_literange4.inc
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            transport="work/transport-native/$abi/libnova_transport.so"
            avos="native-src/native/avos/libs/$abi/libavos.so"
            symbol_dump="work/transport-native/$abi/exported-symbols.txt"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$transport" > "$symbol_dump"
            # AVOS dlsym fails before RAW init if either exported symbol is absent.
            for required in nova_transport_set_target_bps nova_transport_mark_first_frame; do
              if ! grep -Eq " [TW] $required$" "$symbol_dump"; then
                echo "::error::Missing AVOS transport ABI symbol $required for $abi"
                exit 1
              fi
            done
            if ! grep -aq 'NOVA_ISO_TRACK_CAPTURE_V1' "$transport" || \
               ! grep -aq 'NOVA_ISO_CODEC_CLPI_V2' "$transport" || \
               ! grep -q ' nova_transport_iso_track_language$' "$symbol_dump" || \
               ! grep -q ' nova_transport_iso_track_codec$' "$symbol_dump"; then
              echo "::error::ISO language metadata bridge missing or not exported: $abi"
              exit 1
            fi
            if ! grep -aq 'NOVA_ISO_INDEX_MAP_V3' "$transport"; then
              echo "::error::Run672 index mapping string absent from $transport"
              strings "$transport" | grep -E '(NOVA_ISO|nova_transport_time_to_byte)' | head -20 || true
              exit 1
            fi
            if ! grep -aq 'NOVA_ISO_INDEX_SEEK_V3' "$avos"; then
              echo "::error::Run672 index seek string absent from $avos"
              strings "$avos" | grep -E '(NOVA_ISO|NOVA_RAW_FIXED128_POLICY)' | head -20 || true
              exit 1
            fi
            for symbol in NOVA_LITERANGE4_CONN NOVA_MULTI_RANGE_BACKOFF NOVA_MULTI_RANGE_HISTORY_CLEAR NOVA_MULTI_PAIR_REARM NOVA_MULTI_SINGLE_VERIFIED NOVA_LITERANGE4_SEEK_NOOP NOVA_LITERANGE4_START NOVA_LITERANGE4_NET NOVA_LITERANGE4_PIECE NOVA_MULTI_SEEK_GUARD_BEGIN NOVA_MULTI_SEEK_GUARD_END NOVA_MULTI_SCOPE_V3; do
              grep -aq "$symbol" "$transport" || { echo "::error::Dual-Range marker missing: $symbol in $abi"; exit 1; }
            done
            grep -aq NOVA_60FPS_W2_IO_CPU_V1 "$transport" || { echo "::error::60fps IO CPU evidence missing in $abi"; exit 1; }
            grep -aq 'threadCpuUs=' "$avos" || { echo "::error::60fps render CPU evidence missing in $abi"; exit 1; }
            grep -aq NOVA_MULTI_SEEK_SIGNAL "$avos" || { echo "::error::AVOS seek guard missing in $abi"; exit 1; }
            echo "NOVA_60FPS_EVIDENCE_ELF_PASS $abi"
            echo "NOVA_DUAL2_SEEK_GUARD_ELF_PASS $abi"
            echo "RUN672_INDEX_SYMBOLS_PASS $abi"
          done

