            "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "native-src/native/avos/libs/$abi/libavosjni.so" | grep -F ' nova_global_log_enabled'
