name: Nova Video Player mod

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: ['test/939-seek-pool-forensics', 'test/940-shared-mkv-zero-copy-integrity', 'test/946-shared42-backpressure-resume', 'test/925-shared42-zero-copy', main, Test, Always-new, 'fix/v662-precise-keyframe-backseek-20261028', 'fix/v662-ts-eof-pcm-leadgate-20261028', 'fix/main-startup-seek-only-20261028', 'ci/full-latest-6_6_2-20261028', 'ci/alwaysnew-precise-seek-dual2-20261029', 'ci/alwaysnew-dual2-http403-recovery-20261029', 'ci/alwaysnew-dual2-keepalive-range-20261029', 'ci/alwaysnew-dual2-hardening-20261029']

permissions:
  contents: write

concurrency:
  group: nova-video-player-mod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare tools and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          # Install only tools missing from the runner to avoid apt stalls.
          missing=()
          for spec in zstd:zstd git:git make:make mvn:maven cc:build-essential wget:wget curl:curl unzip:unzip pkg-config:pkg-config ninja:ninja-build; do
            bin="${spec%%:*}"
            pkg="${spec#*:}"
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing+=("$pkg")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf "CI preflight: missing packages: %s\n" "${missing[*]}"
            timeout 120s sudo apt-get update -qq
            timeout 240s sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          else
            echo 'CI preflight: required build tools are already installed'
          fi
          # GitHub apt mirrors timed out twice installing meson+ffmpeg (exit 124).
          # Isolate pinned host-only build tools; do not alter APK dependencies.
          if ! command -v meson >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            echo 'CI preflight: provision pinned Meson and FFmpeg without apt'
            python3 -m venv .nova-ci-deps
            timeout 180s .nova-ci-deps/bin/python -m pip install --disable-pip-version-check --no-input --no-cache-dir 'meson==1.7.0' 'imageio-ffmpeg==0.6.0'
            mkdir -p .nova-ci-bin
            ln -s "$PWD/.nova-ci-deps/bin/meson" .nova-ci-bin/meson
            ffmpeg_exe="$(.nova-ci-deps/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            test -x "$ffmpeg_exe"
            ln -s "$ffmpeg_exe" .nova-ci-bin/ffmpeg
            export PATH="$PWD/.nova-ci-bin:$PATH"
            echo "$PWD/.nova-ci-bin" >> "$GITHUB_PATH"
          fi
          meson --version
          ffmpeg -version | head -n 1
          mkdir -p inputs dist tools work reports
          python3 scripts/direct_transport_audit.py --source --require-removed
          python3 -m unittest discover -s tests -p test_direct_transport_lifecycle.py -v
          python3 -m unittest discover -s tests -p test_literange4.py -v
          python3 -m unittest discover -s tests -p test_shared42_page_view_native.py -v
          python3 -m unittest discover -s tests -p test_shared42_backpressure.py -v
          python3 -m unittest discover -s tests -p test_literange4_keepalive.py -v
          python3 -m unittest discover -s tests -p test_literange4_hardening.py -v
          python3 -m unittest discover -s tests -p test_mp4_seek_verification.py -v
          python3 -m unittest discover -s tests -p test_iso_metadata_cache.py -v
          python3 -m unittest discover -s tests -p test_iso_index_seek_v2.py -v
          python3 -m unittest discover -s tests -p test_iso_track_language_metadata.py -v
          python3 -m unittest discover -s tests -p test_tv_track_width_patch.py -v
          python3 -m unittest discover -s tests -p test_tv_first_focus_layout.py -v
          python3 -m unittest discover -s tests -p test_tv_small_card_spacing_patch.py -v
          python3 -m unittest discover -s tests -p test_webdav_resume_local_only_patch.py -v
          python3 -m unittest discover -s tests -p test_weak_start_proxy.py -v
          python3 -m unittest discover -s tests -p test_noniso_startup_zero_seek.py -v
          python3 -m unittest discover -s tests -p test_main_startup_seek_only.py -v
          python3 -m unittest discover -s tests -p test_weak_network_native.py -v
          python3 -m unittest discover -s tests -p test_noniso_seek_avio.py -v
          python3 -m unittest discover -s tests -p test_redirect_freshness.py -v
          python3 -m unittest discover -s tests -p test_mkv_bbc_seek_regression.py -v
          python3 -m unittest discover -s tests -p test_startup_freeze_trace.py -v
          python3 -m py_compile scripts/mkv_bbc_cue_seek_patch.py scripts/iso_track_metadata_patch.py scripts/smoke_noniso_single_get_android.py
          python3 -m py_compile scripts/granular.py scripts/granular_build.py scripts/direct_transport_native_patch.py scripts/direct_transport_apply.py scripts/direct_transport_audit.py scripts/webdav_credential_coldboot_patch.py scripts/smoke_direct_webdav.py scripts/av_diag_patch.py scripts/startup_freeze_trace_patch.py scripts/final_freeze_forensics_patch.py scripts/pgs_history_bypass_ab_patch.py scripts/mp4_seek_slow_read_grace_patch.py scripts/seek_priority_patch.py scripts/seek_cache_window_patch.py scripts/seek_video_index_patch.py scripts/smoke_mp4_raw_seek_race.py scripts/disable_all_subtitle_history_patch.py scripts/late_stall_self_heal_patch.py scripts/seek_safe_serial_v2_patch.py scripts/seek_engine_diag_patch.py scripts/seek_sfdec2_frame_return_patch.py scripts/seek_codec_pool_diag_patch.py scripts/iso_index_seek_patch.py scripts/libbluray_iso_index_patch.py
          python3 -m py_compile scripts/tv_small_card_spacing_patch.py scripts/webdav_resume_local_only_patch.py scripts/smoke_webdav_resume_local_only.py scripts/smoke_literange4_concurrency.py scripts/smoke_literange4_http403.py scripts/smoke_literange4_http429.py scripts/smoke_literange4_keepalive.py scripts/smoke_literange4_http403_repeat.py
          echo 'CI preflight: apktool download (max 120s)'
          timeout 120s curl -fL --retry 2 --connect-timeout 15 --max-time 45 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Resolve and download official latest stable APK
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py download --apk inputs/official.apk --metadata inputs/upstream.json

      - name: Inspect original TV popup focus and animation smali
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar tools/apktool.jar d --no-debug-info -f inputs/official.apk -o work/tv-forensics
          python3 scripts/tv_focus_forensics.py work/tv-forensics reports/tv-focus-forensics
          test -s reports/tv-focus-forensics/original/TVCardView.smali.txt
          test -s 'reports/tv-focus-forensics/original/TVCardView$ExpandAnimation.smali.txt'
          test -s reports/tv-focus-forensics/original/TVMenuAdapter.smali.txt

      - name: Verify original APK signature
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$SIGNER" verify --verbose --print-certs inputs/official.apk > reports/official-signature.txt

      - name: Build patched AVOS native rebuffer core
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?ANDROID_NDK_LATEST_HOME is not set}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          mkdir -p native-src
          cd native-src
          # Derive native manifest from the ACTUALLY selected official latest stable release.
          # The CI fails rather than reusing old AVOS when the official minor version changes.
          official_manifest="$(python3 ../scripts/official_native_manifest.py ../inputs/upstream.json)"
          echo "Official source manifest: $official_manifest"
          curl -fsSL --retry 3 -o ../work/official-native-manifest.xml "https://raw.githubusercontent.com/nova-video-player/aos-AVP/nova/$official_manifest"
          test -s ../work/official-native-manifest.xml
          # Fail closed for unported major/minor source revisions. v6.6 is validated;
          # future versions must be deliberately ported rather than silently using v6.6.
          if [[ "$official_manifest" != "v6_6.xml" ]]; then
            echo "::error::Official $official_manifest requires native patch source port before publishing"
            exit 1
          fi
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m "$official_manifest"
          repo sync -j 4
          git -C native/avos rev-parse HEAD | tee ../reports/upstream-avos-head.txt
          cd ..
          python3 scripts/v66_subtitle_jni_patch.py --native native-src/native/avos
          python3 scripts/native_rebuffer_patch.py native-src/native/avos --allow-unpinned-head --report reports/native-rebuffer.json
          python3 scripts/direct_transport_native_patch.py native-src/native/avos --report reports/direct-transport-native.json
          python3 scripts/shared42_native_patch.py --native native-src/native/avos
          python3 scripts/shared42_pool_audit_v2_patch.py --transport iso/nova_transport.c
          python3 scripts/playback_completion_patch.py native-src/native/avos --report reports/playback-completion-native.json
          python3 scripts/main655_ts_eof_lead_gate.py --native native-src/native/avos --report reports/main655-ts-eof-leadgate.json
          python3 scripts/ts_bitrate_patch.py native-src/native/avos --report reports/ts-bitrate.json
          python3 scripts/ts_resume_fallback_patch.py native-src/native/avos --report reports/ts-resume-fallback.json
          python3 scripts/iso_fast_probe_patch.py native-src/native/avos --report reports/iso-fast-probe.json
          python3 scripts/iso_seek_ui_patch.py --native native-src/native/avos --report reports/iso-timeline.json
          python3 scripts/av_diag_patch.py --native native-src/native/avos --report reports/av-diagnostics.json
          python3 scripts/startup_freeze_trace_patch.py --native native-src/native/avos --report reports/startup-freeze-trace.json
          python3 scripts/final_freeze_forensics_patch.py --native native-src/native/avos --report reports/final-freeze-forensics.json
          python3 scripts/pgs_history_bypass_ab_patch.py --native native-src/native/avos --report reports/pgs-history-bypass-ab.json
          python3 scripts/mp4_seek_slow_read_grace_patch.py --native native-src/native/avos --report reports/mp4-seek-slow-read-grace.json
          # Strictly revert unsafe Test-only seek experiments. Keep the
          # proven RUN638 network/seek path and unchanged 2X/5X thresholds.
          if grep -Eq 'seek_preempt|seek_pending|NOVA_RAW_CACHE_SEEK_V1|NOVA_FAST_VIDEO_INDEX_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c; then echo '::error::Experimental Seek path still present'; exit 1; fi
          python3 scripts/disable_all_subtitle_history_patch.py --native native-src/native/avos --report reports/all-subtitle-history-disabled.json
          python3 scripts/late_stall_self_heal_patch.py --native native-src/native/avos --report reports/late-render-recovery.json
          python3 scripts/seek_sfdec2_frame_return_patch.py --native native-src/native/avos
          grep -Fq 'NOVA_SFDEC2_NO_OUTPUT_RETURN_V1' native-src/native/avos/Source/codec_sfdec2.c
          python3 scripts/seek_engine_diag_patch.py --native native-src/native/avos
          python3 scripts/seek_stall_forensics_v2_patch.py --native native-src/native/avos
          python3 scripts/seek_codec_pool_diag_patch.py --native native-src/native/avos
          grep -Fq 'NOVA_SUB_HISTORY_DISABLED_ALL_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_LATE_STALL_SELF_HEAL_V1' native-src/native/avos/Source/codec_sfdec2.c
          if grep -Eq '_cache_subtitle_packet\(|_subtitle_recovery_point\(' native-src/native/avos/Source/stream_parser_ffmpeg.c; then echo '::error::History code still compiled'; exit 1; fi
          grep -Fq 'NOVA_MP4_SEEK_SLOW_READ_GRACE_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          # ISO-only root fix: use non-mutating libbluray CLPI index lookup,
          # preserving the RAW producer position and FFmpeg fallback.
          python3 scripts/iso_index_seek_patch.py --native native-src/native/avos --transport iso/nova_transport.c
          # MKV-only Cues/backward seek is intentionally applied AFTER ISO patch.
          # The ISO CLPI path and all non-MKV fallback branches stay untouched.
          python3 scripts/mkv_bbc_cue_seek_patch.py --native native-src/native/avos
          python3 scripts/iso_track_metadata_patch.py --native native-src/native/avos
          python3 scripts/startup_bbc_seek_fix_patch.py --native native-src/native/avos --report reports/startup-bbc-seek-fix.json
          NOVA_PATCHED_AVOS_ROOT="$PWD/native-src/native/avos" python3 -m unittest discover -s tests -p test_startup_bbc_seek_native.py -v
          grep -Fq 'NOVA_STARTUP_AUDIO_NO_TIMELINE_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'return stream_parser_set_audio_stream( s, audio_stream);' native-src/native/avos/Source/stream_parser_ffmpeg.c
          python3 scripts/precise_seek_patch.py --native native-src/native/avos --report reports/precise-seek.json
          NOVA_PATCHED_AVOS_ROOT="$PWD/native-src/native/avos" python3 -m unittest discover -s tests -p test_precise_seek_native.py -v
          grep -Fq 'NOVA_ISO_TRACK_APPLIED_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_BBC_CUE_SEEK_V1' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_SEEK_SCAN_BEGIN_V2' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_MKV_SEEK_DONE_V2' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_ISO_INDEX_SEEK_V3' native-src/native/avos/Source/stream_parser_ffmpeg.c
          grep -Fq 'NOVA_ISO_INDEX_MAP_V3' iso/nova_transport.c
          # Upstream prebuilt-ffmpeg v8_0 currently ships dist-full-* only.
          # AVOS base/full differ only by which FFmpeg directory is linked; no
          # AVOS source feature macro depends on LIBAV_CONFIG. Alias the same
          # FFmpeg 8.0 ABI into the base path, then keep ONLY rebuilt libavos.so.
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "native-src/native/prebuilt/ffmpeg/dist-full-$abi/lib/libavcodec.so"
            if [[ ! -e "native-src/native/prebuilt/ffmpeg/dist-base-$abi" ]]; then
              ln -s "dist-full-$abi" "native-src/native/prebuilt/ffmpeg/dist-base-$abi"
            fi
          done
          echo 'NOVA_V66_FFMPEG_PATCHED_LINES_3090_3180_BEGIN'
          nl -ba native-src/native/avos/Source/stream_parser_ffmpeg.c | sed -n '3090,3180p'
          echo 'NOVA_V66_FFMPEG_PATCHED_LINES_END'
          cd native-src
          MAKE_JOBS=4 BUILD=release make native_build_native/libnativehelper
          MAKE_JOBS=4 BUILD=release make native_avos_base
          cd ..
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          mkdir -p work/official-native
          {
            for abi in armeabi-v7a arm64-v8a x86 x86_64; do
              new="native-src/native/avos/libs/$abi/libavos.so"
              old="work/official-native/libavos-$abi.so"
              test -s "$new"
              jni="native-src/native/avos/libs/$abi/libavosjni.so"
              test -s "$jni"
              if ! "$NM" -D "$jni" | grep -F ' Java_com_archos_mediacenter_video_player_SubtitleEngine_nativeCreate'; then
                echo "::error::Official v6.6 SubtitleEngine.nativeCreate JNI missing from $abi rebuilt libavosjni.so"
                exit 1
              fi
              if ! "$NM" -D "$new" | grep -F ' sub_engine_create'; then
                echo "::error::Official v6.6 subtitle core missing from $abi libavos.so"
                exit 1
              fi
              for trace in NOVA_SYNC_PUT NOVA_SYNC_RENDER_CLOCK NOVA_SYNC_LATE NOVA_SYNC_SEEK_RESET NOVA_SYNC_PCM_CORRECTION NOVA_SYNC_AUDIO_START NOVA_FINAL_HEARTBEAT NOVA_FINAL_PARSER_QUEUE NOVA_FINAL_RENDER_Q NOVA_SUB_HISTORY_DISABLED_ALL_V1 NOVA_LATE_STALL_SELF_HEAL_V1 NOVA_SEEK_ENGINE_DIAG_V1 NOVA_SEEK_POOL_OWNERS_V1 NOVA_MKV_SEEK_SCAN_BEGIN_V2 NOVA_MKV_BBC_SEEK_STOP_V1 NOVA_ISO_TRACK_APPLIED_V1 NOVA_ISO_CODEC_AUDIT_V2 NOVA_ISO_CODEC_LABEL_V2 NOVA_STARTUP_NATIVE_ZERO_SKIP_V2 NOVA_MKV_SEEK_REJECT_V3 NOVA_MKV_SEEK_POSITION_V3 NOVA_PRECISE_SEEK_BEGIN_V1 NOVA_PRECISE_SEEK_DONE_V1; do
                if ! grep -aq "$trace" "$new"; then
                  echo "::error::Missing $trace instrumentation from $abi libavos.so"
                  exit 1
                fi
              done
              unzip -p inputs/official.apk "lib/$abi/libavos.so" > "$old"
              test -s "$old"
              new_needed="$("$READELF" -d "$new" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort)"
              old_needed="$("$READELF" -d "$old" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort)"
              if [[ "$new_needed" != "$old_needed" ]]; then
                echo "::error::DT_NEEDED mismatch for $abi"
                diff -u <(printf '%s\n' "$old_needed") <(printf '%s\n' "$new_needed") || true
                exit 1
              fi
              sha256sum "$new"
            done
          } | tee reports/native-libavos-sha256.txt

      - name: Build unified direct native transport
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?ANDROID_NDK_LATEST_HOME is not set}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash scripts/build_transport_native.sh work/transport-native
          # Run681 regression: four-ABI ELF marker checks for FILE-only fix.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -aq 'NOVA_FILE_SEEK_RECOVERED' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_FILE_FRESH_RANGE_V1' "work/transport-native/$abi/libnova_transport.so" || exit 1
            grep -aq 'NOVA_NONISO_AVIO_UNLATCH_V1' "native-src/native/avos/libs/$abi/libavos.so" || exit 1
          done
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            transport="work/transport-native/$abi/libnova_transport.so"
            avos="native-src/native/avos/libs/$abi/libavos.so"
            symbol_dump="work/transport-native/$abi/exported-symbols.txt"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$transport" > "$symbol_dump"
            if ! grep -aq 'NOVA_ISO_TRACK_CAPTURE_V1' "$transport" || \
               ! grep -aq 'NOVA_ISO_CODEC_CLPI_V2' "$transport" || \
               ! grep -q ' nova_transport_iso_track_language$' "$symbol_dump" || \
               ! grep -q ' nova_transport_iso_track_codec$' "$symbol_dump"; then
              echo "::error::ISO language metadata bridge missing or not exported: $abi"
              exit 1
            fi
            if ! grep -aq 'NOVA_ISO_INDEX_MAP_V3' "$transport"; then
              echo "::error::Run672 index mapping string absent from $transport"
              strings "$transport" | grep -E '(NOVA_ISO|nova_transport_time_to_byte)' | head -20 || true
              exit 1
            fi
            if ! grep -aq 'NOVA_ISO_INDEX_SEEK_V3' "$avos"; then
              echo "::error::Run672 index seek string absent from $avos"
              strings "$avos" | grep -E '(NOVA_ISO|NOVA_RAW_FIXED128_POLICY)' | head -20 || true
              exit 1
            fi
            for symbol in NOVA_LITERANGE4_CONN NOVA_MULTI_RANGE_BACKOFF NOVA_MULTI_RANGE_HISTORY_CLEAR NOVA_MULTI_PAIR_REARM NOVA_MULTI_SINGLE_VERIFIED NOVA_LITERANGE4_SEEK_NOOP NOVA_LITERANGE4_START NOVA_LITERANGE4_NET NOVA_LITERANGE4_PIECE NOVA_MULTI_SEEK_GUARD_BEGIN NOVA_MULTI_SEEK_GUARD_END NOVA_MULTI_SCOPE_V3; do
              grep -aq "$symbol" "$transport" || { echo "::error::Dual-Range marker missing: $symbol in $abi"; exit 1; }
            done
            grep -aq NOVA_MULTI_SEEK_SIGNAL "$avos" || { echo "::error::AVOS seek guard missing in $abi"; exit 1; }
            echo "NOVA_DUAL2_SEEK_GUARD_ELF_PASS $abi"
            echo "RUN672_INDEX_SYMBOLS_PASS $abi"
          done

      - name: Apply instruction and XML-property patches to latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/granular_build.py --apk inputs/official.apk --metadata inputs/upstream.json --apktool tools/apktool.jar --work work --reports reports --native-lib-root native-src/native/avos/libs --output work/granular-UNSIGNED.apk

      - name: Restore saved WebDAV credentials on cold startup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/webdav_credential_coldboot_patch.py work/granular-UNSIGNED.apk work/credential-UNSIGNED.apk --report reports/webdav-credential-coldboot.json

      - name: Apply direct native transport to WebDAV playback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/direct_transport_apply.py \
            --source work/credential-UNSIGNED.apk \
            --output work/direct-UNSIGNED.apk \
            --apktool tools/apktool.jar \
            --native-root work/transport-native \
            --work work
          python3 scripts/direct_transport_audit.py --source
          # Verify both source-level Java origins were changed.
          startup_service=(work/direct-final/smali*/com/archos/mediacenter/video/player/PlayerService.smali)
          resume_ctx=(work/direct-final/smali*/com/archos/mediacenter/video/player/Player\$ResumeCtx.smali)
          test "${#startup_service[@]}" -eq 1
          test "${#resume_ctx[@]}" -eq 1
          grep -Fq 'NOVA_STARTUP_ZERO_NO_REQUEST_V1' "${startup_service[0]}"
          grep -Fq 'NOVA_RESUME_ZERO_NO_REQUEST_V1' "${resume_ctx[0]}"

      - name: Align sign and verify the final APK
        id: signing
        shell: bash
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          ALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          STORE="$RUNNER_TEMP/nova-signing.jks"
          trap 'rm -f "$STORE"' EXIT
          if [[ -n "$NOVA_KEYSTORE_BASE64" && -n "$NOVA_STORE_PASSWORD" && -n "$NOVA_KEY_ALIAS" && -n "$NOVA_KEY_PASSWORD" ]]; then
            printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 -d > "$STORE"
            SIGNING_MODE=configured-key
          elif [[ -z "$NOVA_KEYSTORE_BASE64" && -z "$NOVA_STORE_PASSWORD" && -z "$NOVA_KEY_ALIAS" && -z "$NOVA_KEY_PASSWORD" ]]; then
            NOVA_STORE_PASSWORD="$(openssl rand -hex 16)"
            NOVA_KEY_PASSWORD="$NOVA_STORE_PASSWORD"
            NOVA_KEY_ALIAS=nova-cloud-test
            keytool -genkeypair -noprompt -keystore "$STORE" -alias "$NOVA_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Nova Granular Cloud Test' -storepass "$NOVA_STORE_PASSWORD" -keypass "$NOVA_KEY_PASSWORD"
            SIGNING_MODE=temporary-test-key
            echo '::warning::Test certificate only. It cannot update an installed APK signed with a different key. Back up app data before any uninstall.'
          else
            echo '::error::Incomplete signing secrets' && exit 1
          fi
          "$ALIGN" -f -p 4 work/direct-UNSIGNED.apk work/aligned-UNSIGNED.apk
          export NOVA_STORE_PASSWORD NOVA_KEY_PASSWORD
          "$SIGNER" sign --min-sdk-version 23 --v4-signing-enabled false --ks "$STORE" --ks-key-alias "$NOVA_KEY_ALIAS" --ks-pass env:NOVA_STORE_PASSWORD --key-pass env:NOVA_KEY_PASSWORD --out dist/Nova_Video_Player_mod_SIGNED.apk work/aligned-UNSIGNED.apk
          "$SIGNER" verify --min-sdk-version 23 --verbose --print-certs dist/Nova_Video_Player_mod_SIGNED.apk | tee reports/final-signature.txt
          # Both stored resource alignment and native-library page alignment
          # matter for PackageManager, not merely a valid ZIP signature.
          "$ALIGN" -c -p 4 dist/Nova_Video_Player_mod_SIGNED.apk
          unzip -tq dist/Nova_Video_Player_mod_SIGNED.apk
          python3 scripts/direct_transport_audit.py --apk dist/Nova_Video_Player_mod_SIGNED.apk
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          printf '{"signing_mode":"%s"}\n' "$SIGNING_MODE" > reports/signing.json
          (cd dist && sha256sum Nova_Video_Player_mod_SIGNED.apk > SHA256SUMS.txt)

      - name: Upload runnable direct-transport test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-direct-transport-runnable-${{ github.run_number }}
          path: |
            dist/Nova_Video_Player_mod_SIGNED.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch final APK on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 scripts/smoke_install.py dist/Nova_Video_Player_mod_SIGNED.apk --reports reports
            # The actual signed player's WebDAV MKV weak-network test below
            # verifies one-use signed redirects, first frame, Range and Seek.
            # A standalone app_process on Android 11 was OOM-killed twice.
            python3 scripts/smoke_direct_webdav.py --reports reports
            python3 scripts/smoke_literange4_concurrency.py --reports reports
            python3 scripts/smoke_literange4_http403.py --reports reports
            python3 scripts/smoke_literange4_http429.py --reports reports
            python3 scripts/smoke_literange4_http403_repeat.py --reports reports
            python3 scripts/smoke_literange4_keepalive.py --reports reports
            python3 scripts/smoke_weaknet_webdav_formats.py --reports reports
            python3 scripts/smoke_playback_completion.py --reports reports
            python3 scripts/smoke_seek_eof_completion.py --reports reports
            python3 scripts/smoke_mp4_tail_moov.py --reports reports
            python3 scripts/smoke_mp4_raw_seek_race.py --reports reports
            # This independent startup-only branch intentionally leaves the
            # main-branch unknown-duration TS relative-seek handling untouched.
            # Do not silently claim its existing EOF stress test passed.
            echo 'BASELINE_TS_EOF_SEEK=NOT_VALIDATED_ON_STARTUP_ONLY_BRANCH' | tee reports/startup-only-ts-scope.txt

      - name: Install and launch final APK on Android 14 (second independent package-manager check)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 scripts/smoke_install.py dist/Nova_Video_Player_mod_SIGNED.apk --reports reports/android14
             # Signed APK ART probe: zero remote resume PUT; normal upload still works.
             python3 scripts/smoke_webdav_resume_local_only.py dist/Nova_Video_Player_mod_SIGNED.apk --reports reports/android14

      - name: Verify official latest selection remains current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py assert-current --apk inputs/official.apk --metadata inputs/upstream.json

      - name: Persist extracted granular specification on the test branch
        if: github.ref == 'refs/heads/ci/granular-patches-20261015'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch patches/v982-granular.json >/dev/null 2>&1; then
            echo 'Granular specification is already versioned.'
            exit 0
          fi
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          test "$remote_sha" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          data={'message':'Persist granular instruction and XML rules after signed APK installation tests',
                'branch':os.environ['GITHUB_REF_NAME'],
                'content':base64.b64encode(Path('patches/v982-granular.json').read_bytes()).decode()}
          Path('work/spec-upload.json').write_text(json.dumps(data))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/patches/v982-granular.json" --input work/spec-upload.json --jq '{commit: .commit.sha, blob: .content.sha}' > reports/persisted-spec.json

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-installable-signed-${{ github.run_number }}
          path: |
            dist/Nova_Video_Player_mod_SIGNED.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish validated Release and keep latest three
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_RELEASE_ID: ${{ steps.upstream.outputs.release_id }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('reports/installation.json').read_text())
          assert r['status']=='PASS'
          Path('dist/RELEASE_NOTES.md').write_text('Official base: '+os.environ['UPSTREAM_TAG']+'\n\nInstruction-hunk and XML-property patches applied to the selected latest APK. No old DEX/class/module replacement. Android 11 x86_64 clean installation and both launcher startup checks passed. WebDAV/SMB/playback on your device still require acceptance testing.\n\nSigning: '+os.environ['SIGNING_MODE']+'. A different signing certificate cannot update your existing installation. Back up data before uninstalling.\n\nInstall only Nova_Video_Player_mod_SIGNED.apk; reports contain no installable APK.\n')
          PY
          tag="nova-mod-granular-${UPSTREAM_RELEASE_ID}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/Nova_Video_Player_mod_SIGNED.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nova Video Player mod - ${UPSTREAM_TAG} granular" --notes-file dist/RELEASE_NOTES.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv' | sort -r | tail -n +4 | cut -f2- | while IFS= read -r old; do
            [[ -z "$old" || "$old" == "$tag" ]] && continue
            case "$old" in nova-mod-*|v9.8.2-cloud-*) gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ;; esac
          done

      - name: Publish tested Test pre-release APK for direct downloads
        if: github.ref == 'refs/heads/Test' && github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for platform, path in [('Android 11', 'reports/installation.json'),
                                 ('Android 14', 'reports/android14/installation.json')]:
              record=json.loads(Path(path).read_text())
              assert record['status']=='PASS', (platform, record)
              assert len(record['launches'])==2, (platform, record)
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)
          tag="nova-run-${GITHUB_RUN_NUMBER}-iso-index-1p5x3x"
          gh release create "$tag" \
            dist/Nova_Video_Player_mod_SIGNED.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nova Test Run ${GITHUB_RUN_NUMBER}: read-only ISO index + 1.5X/3X" \
            --prerelease \
            --notes "Built from pinned Test sources. Android 11 and Android 14 clean install and both launcher checks passed; APK v1/v2 signature and ZIP alignment verified. Single-clip Blu-ray ISO CLPI lookup is non-mutating with FFmpeg fallback. Network ISO playback on the user's Amlogic device remains to be field-tested. Different signing certificates cannot update an installed previous APK. Back up settings before uninstalling."
          echo "DIRECT_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Nova_Video_Player_mod_SIGNED.apk"

      - name: Publish isolated startup-only validated APK
        if: github.ref == 'refs/heads/fix/main-startup-seek-only-20261028' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for label, path in [
              ('Android 11', 'reports/installation.json'),
              ('Android 14', 'reports/android14/installation.json'),
          ]:
              r = json.loads(Path(path).read_text())
              assert r['status'] == 'PASS', (label, r)
              assert len(r['launches']) == 2, (label, r)
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)
          tag="nova-main-startup-seek-only-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            dist/Nova_Video_Player_mod_SIGNED.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nova main-based startup zero Seek fix - Run ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Independent main-based startup-only change; source-side zero Seek(0) suppression and initial audio selection. Mid-playback audio switching, manual seeks, decoders, and transport are unchanged. Android 11 and 14 checks passed. Official v6.5.5 SHA-256 baseline. Full-size real-device files still require field testing; test key may differ from installed app."
          echo "DIRECT_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Nova_Video_Player_mod_SIGNED.apk"

      - name: Upload diagnostics only - no intermediate APKs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: Nova-reports-NOT-an-installer-${{ github.run_number }}
          path: |
            reports/
            inputs/upstream.json
          retention-days: 14
          if-no-files-found: ignore
