            grep -Fq 'for(int i=0;i<8 && nova_diag_on();i++)' native-src/native/avos/Source/stream_video.c
            grep -Fq 'int64_t start=nova_global_log_enabled()?nova1074_mono_ms():0;' native-src/native/avos/Source/sub_engine_registry.c
            grep -Fq 'if(nova_diag_on())clock_gettime(CLOCK_MONOTONIC,&nova1074_t0);' native-src/native/avos/Source/sub_render_gl.c
            grep -Fq 'nova_1200_end_reset' work/direct-final/smali*/com/archos/mediacenter/video/player/NovaLoadingTrace.smali
