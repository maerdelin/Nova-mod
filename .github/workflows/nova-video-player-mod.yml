          if [ "$GITHUB_REF_NAME" = "fix/global-logs-1200-source-only-review-20261104" ] || [ "$GITHUB_REF_NAME" = "Always-new" ] || [ "$GITHUB_REF_NAME" = "fix/393-seek-exit-anr-20261106" ] || [ "$GITHUB_REF_NAME" = "upgrade/nova-v6.6.4-official-20261105" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            grep -Fq 'if(av_log_get_level()!=wanted)' native-src/native/avos/Source/stream_parser_ffmpeg.c
