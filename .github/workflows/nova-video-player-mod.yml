          grep -Fq 'android:title="日志" android:key="nova_logs_enabled" android:defaultValue="false"' work/direct-final/res/xml/preferences_video.xml
          grep -R -Fq 'NOVA_GLOBAL_LOGS_TOGGLE_V1' work/direct-final/smali*/com/archos/mediacenter/video/NovaGlobalLogs.smali
          grep -Fq 'NovaGlobalLogs;->init' work/direct-final/smali*/com/archos/mediacenter/video/CustomApplication.smali
          grep -Fq 'NovaGlobalLogs;->update' work/direct-final/smali*/com/archos/mediacenter/video/utils/VideoPreferencesCommon.smali
          ! grep -R -Fq 'nova_diag_gate_on' iso/nova_literange4.inc iso/nova_transport.c iso/nova_iso_blackbox.inc
          grep -Fq 'NOVA_GLOBAL_LOGS_TOGGLE_V1' native-src/native/avos/Source/log_android.c
          grep -Fq 'NOVA_GLOBAL_LOGS_JNI_GUARD_V2' native-src/native/avos/jni/libavosjni/libavos.h
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
