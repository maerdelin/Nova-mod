name: NOVA 994 UI source forensics
on:
  workflow_dispatch:
  push:
    branches: ['feat/994-parallel-iso-mkv-startup-loading-20261031']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 993 APK and disassemble actual Activity layout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app tools decoded forensics
          gh run download 41193199944 -n Nova-installable-signed-993 -D app
          test -s app/Nova_Video_Player_mod_SIGNED.apk
          timeout 120 curl -fsSL --retry 2 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          java -Xmx4g -jar tools/apktool.jar d -f --no-debug-info app/Nova_Video_Player_mod_SIGNED.apk -o decoded
          find decoded -type f \( -name 'PlayerActivity*.smali' -o -name 'Player*.smali' -o -name 'NovaLoadingTrace.smali' -o -name '*player*.xml' -o -name '*loading*.xml' -o -name 'public.xml' -o -name 'strings.xml' \) -print0 | xargs -0 -r cp --parents -t forensics
          python3 scripts/direct_transport_audit.py --source --require-removed
          python3 -m unittest discover -s tests -p test_iso_metadata_cache.py -v
          python3 -m unittest discover -s tests -p test_direct_transport_lifecycle.py -v
          python3 -m unittest discover -s tests -p test_torrent_crash_guard_patch.py -v
          python3 -m unittest discover -s tests -p test_literange4.py -v
          python3 -m unittest discover -s tests -p test_shared42_page_view_native.py -v
          python3 -m unittest discover -s tests -p test_shared42_backpressure.py -v
          python3 -m unittest discover -s tests -p test_literange4_keepalive.py -v
          python3 -m unittest discover -s tests -p test_literange4_hardening.py -v
          python3 -m unittest discover -s tests -p test_60fps_clock_evidence.py -v
          python3 -m unittest discover -s tests -p test_startup_freeze_trace.py -v
          python3 -m unittest discover -s tests -p test_redirect_timeout_classifier.py -v
          python3 -m unittest discover -s tests -p test_mp4_seek_verification.py -v
          python3 -m unittest discover -s tests -p test_iso_index_seek_v2.py -v
          python3 -m unittest discover -s tests -p test_iso_track_language_metadata.py -v
          python3 -m unittest discover -s tests -p test_tv_track_width_patch.py -v
          python3 -m unittest discover -s tests -p test_tv_first_focus_layout.py -v
          python3 -m unittest discover -s tests -p test_tv_small_card_spacing_patch.py -v
          python3 -m unittest discover -s tests -p test_tv_list_view_field.py -v
          python3 -m unittest discover -s tests -p test_webdav_resume_local_only_patch.py -v
          python3 -m unittest discover -s tests -p test_weak_start_proxy.py -v
          python3 -m unittest discover -s tests -p test_noniso_startup_zero_seek.py -v
          python3 -m unittest discover -s tests -p test_main_startup_seek_only.py -v
          python3 -m unittest discover -s tests -p test_weak_network_native.py -v
          python3 -m unittest discover -s tests -p test_noniso_seek_avio.py -v
          python3 -m unittest discover -s tests -p test_redirect_freshness.py -v
          python3 -m unittest discover -s tests -p test_mkv_bbc_seek_regression.py -v
          python3 -m unittest discover -s tests -p test_startup_onepass_speed.py -v
          python3 -m unittest discover -s tests -p test_startup_mkv_canonical_first.py -v
          python3 -m unittest discover -s tests -p test_startup_fourfix.py -v
          python3 -m unittest discover -s tests -p test_994_source_guards.py -v
          python3 -m py_compile scripts/native_rebuffer_patch.py scripts/direct_transport_apply.py scripts/startup_loading_994_patch.py
          python3 scripts/startup_loading_994_patch.py decoded
          grep -q 'NovaStartupOverlay;->onPrepared' decoded/smali/com/archos/mediacenter/video/player/PlayerActivity.smali
          grep -q 'nativeStartupPercent()I' decoded/smali_classes*/com/archos/mediacenter/video/player/DirectTransportProxy.smali
          grep -q 'nova_buffer_percent' decoded/res/layout/player.xml
          # Also assemble the modified dex/XML; grep-only checks cannot catch
          # invalid local registers, duplicate labels, or malformed resources.
          if ! java -Xmx4g -jar tools/apktool.jar b decoded -o /tmp/nova-994-ui-smoke-UNSIGNED.apk > forensics/apktool-build.log 2>&1; then
            tail -n 90 forensics/apktool-build.log
            exit 1
          fi
          test -s /tmp/nova-994-ui-smoke-UNSIGNED.apk
          unzip -tq /tmp/nova-994-ui-smoke-UNSIGNED.apk > forensics/apk-zip-integrity.txt
          echo 'NOVA_994_UI_PATCH_SMOKE=PASS ASM=PASS'
          find forensics -type f | sort > forensics/file-list.txt
          test -s forensics/file-list.txt
      - name: Package 994 source snapshot for isolated tests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/nova-994-source.tar.gz scripts iso tests .github/workflows/nova-video-player-mod.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-994-source-snapshot
          path: /tmp/nova-994-source.tar.gz
          retention-days: 4
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-994-ui-forensics
          path: forensics/
          retention-days: 4
          if-no-files-found: error
