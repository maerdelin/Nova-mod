name: NOVA 994 UI source forensics
on:
  workflow_dispatch:
  push:
    branches: ['feat/994-parallel-iso-mkv-startup-loading-20261031']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 993 APK and disassemble actual Activity layout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app tools decoded forensics
          gh run download 41193199944 -n Nova-installable-signed-993 -D app
          test -s app/Nova_Video_Player_mod_SIGNED.apk
          timeout 120 curl -fsSL --retry 2 -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  tools/apktool.jar' | sha256sum -c -
          java -Xmx4g -jar tools/apktool.jar d -f --no-debug-info app/Nova_Video_Player_mod_SIGNED.apk -o decoded
          find decoded -type f \( -name 'PlayerActivity*.smali' -o -name 'Player*.smali' -o -name 'NovaLoadingTrace.smali' -o -name '*player*.xml' -o -name '*loading*.xml' -o -name 'public.xml' -o -name 'strings.xml' \) -print0 | xargs -0 -r cp --parents -t forensics
          find forensics -type f | sort > forensics/file-list.txt
          test -s forensics/file-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-994-ui-forensics
          path: forensics/
          retention-days: 4
          if-no-files-found: error
