name: NOVA signed APK playback regression focus
on:
  push:
    branches: ['ci/full-latest-6_6_2-20261028']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download signed integrated build 841
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist reports
          gh run download 40647935697 -n Nova-direct-transport-runnable-841 --repo "$GITHUB_REPOSITORY" -D dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$signer" verify --verbose dist/Nova_Video_Player_mod_SIGNED.apk
      - name: Verify Android 11 WebDAV reopen and report focused playback trace
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 scripts/smoke_install.py dist/Nova_Video_Player_mod_SIGNED.apk --reports reports
            python3 scripts/smoke_direct_webdav.py --reports reports
      - name: Upload diagnosed WebDAV runtime traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-v66-webdav-reopen-diagnostic-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
