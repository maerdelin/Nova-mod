name: Nova root playback cache

on:
  workflow_dispatch:
  push:
    branches:
      - ci/root-kodi-cache
    paths:
      - 'source-cache/**'
      - '.github/workflows/root-playback-cache.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_SDK_HOME: ${{ env.ANDROID_HOME }}
      ANDROID_SDK: ${{ env.ANDROID_HOME }}
      ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      ANDROID_NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build maven file wget curl unzip git pkg-config python3 python3-pip python3-setuptools
          curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync official Nova source
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m default.xml
          repo sync -j4
          repo forall -c 'git checkout -B root-cache-test $REPO_REMOTE/$REPO_RREV'

      - name: Overlay source-level playback cache
        run: |
          cp source-cache/PlaybackFileCache.java nova/FileCoreLibrary/src/com/archos/filecorelibrary/PlaybackFileCache.java
          python3 source-cache/apply_root_cache.py nova/FileCoreLibrary/src/com/archos/filecorelibrary/StreamOverHttp.java
          grep -n "PlaybackFileCache\|openPlaybackInput\|shouldUsePersistentPlaybackCache" nova/FileCoreLibrary/src/com/archos/filecorelibrary/StreamOverHttp.java

      - name: Build installable source APK
        run: |
          cd nova/Video
          ./gradlew --no-daemon assembleNoamazonDebug

      - name: Collect APK
        run: |
          mkdir -p out
          find nova/Video -type f -path '*/build/outputs/apk/*' -name '*.apk' -print -exec cp {} out/ \;
          test -n "$(find out -name '*.apk' -print -quit)"

      - name: Upload source-built APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-root-playback-cache
          path: out/*.apk
          if-no-files-found: error
